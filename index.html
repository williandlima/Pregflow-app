<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7C3AED">
<meta name="description" content="Gerencie e apresente suas mensagens e pregações.">
<title>PregFlow Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg style="display:none">
    <symbol id="icon-back" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></symbol>
    <symbol id="icon-pdf" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></symbol>
    <symbol id="icon-chevron-up" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></symbol>
</svg>

<!-- SPLASH -->
<div id="splash">
    <div class="logo-container">✝🔥</div>
    <div style="font-weight:700; font-size:24px; letter-spacing:-0.5px; color:var(--text);">PregFlow Pro</div>
</div>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen">
    <header>
        <h1>Mensagens</h1>
        <button id="btn-settings" class="icon-btn" title="Configurações">
            <svg class="icon"><use href="#icon-settings"></use></svg>
        </button>
    </header>

    <div id="sermonList" class="sermon-list"></div>

    <div id="emptyState" style="text-align:center; margin-top:100px; display:none;">
        <div style="font-size:48px; margin-bottom:20px; opacity:0.2;">✝🔥</div>
        <p style="color:var(--text-muted);">Comece a escrever sua primeira mensagem.</p>
    </div>

    <button id="btn-new-sermon" class="fab-main" title="Nova mensagem">
        <svg class="icon icon-lg" style="stroke-width:3"><use href="#icon-plus"></use></svg>
    </button>
</div>

<!-- EDITOR SCREEN -->
<div id="editorScreen" class="screen">
    <div class="editor-nav">
        <button id="btn-back" class="icon-btn" title="Voltar">
            <svg class="icon"><use href="#icon-back"></use></svg>
        </button>

        <div id="saveStatus" class="status-badge">Salvo</div>

        <div style="display:flex; gap:4px;">
            <button id="btn-pdf" class="icon-btn" title="Exportar PDF">
                <svg class="icon"><use href="#icon-pdf"></use></svg>
            </button>
            <button id="btn-bible" class="icon-btn" title="Bíblia">
                <svg class="icon"><use href="#icon-book"></use></svg>
            </button>
            <button id="btn-preach" class="icon-btn" style="color:var(--primary); background:var(--primary-soft)" title="Modo Pregação">
                <svg class="icon" style="fill:currentColor"><use href="#icon-play"></use></svg>
            </button>
        </div>
    </div>

    <div class="input-wrapper">
        <input id="docTitle" class="input-title" placeholder="Título da Mensagem" autocomplete="off">
        <input id="docRef" class="input-ref" placeholder="Referência (ex: Romanos 8:28)" autocomplete="off">
    </div>

    <div class="toolbar-sticky">
        <button id="btn-new-block" class="tool-chip action">
            <svg class="icon icon-sm"><use href="#icon-plus"></use></svg> Novo
        </button>

        <div class="tool-divider"></div>

        <button id="btn-move-up" class="tool-chip" title="Mover bloco para cima">
            <svg class="icon icon-sm"><use href="#icon-chevron-up"></use></svg>
        </button>
        <button id="btn-move-down" class="tool-chip" title="Mover bloco para baixo">
            <svg class="icon icon-sm"><use href="#icon-chevron-down"></use></svg>
        </button>

        <div class="tool-divider"></div>

        <button class="tool-chip" data-format="p" title="Parágrafo">Aa</button>
        <button class="tool-chip" data-format="h1" title="Título">H1</button>
        <button class="tool-chip" data-format="h2" title="Subtítulo">H2</button>
        <button class="tool-chip" data-format="quote" title="Citação">" "</button>
        <button class="tool-chip" data-format="warn" title="Aviso">⚠</button>
        <button class="tool-chip" data-format="box" title="Destaque">★</button>
    </div>

    <div id="editorBlocks"></div>
</div>

<!-- PREACH MODE -->
<div id="preachScreen" class="hidden">
    <div id="preachContent"></div>

    <div id="hud" class="hud-float">
        <button id="btn-font-dec" class="hud-btn" title="Diminuir fonte">A-</button>
        <div id="timerDisplay" style="font-family:monospace; font-size:20px; font-weight:bold; min-width:60px; text-align:center; color:white;">00:00</div>
        <button id="btn-timer" class="hud-btn" title="Iniciar/pausar cronômetro">▶</button>
        <button id="btn-font-inc" class="hud-btn" title="Aumentar fonte">A+</button>
        <div style="width:1px; height:20px; background:#444; margin:0 8px;"></div>
        <button id="btn-exit-preach" class="hud-btn hud-exit">Sair</button>
    </div>

    <div id="hud-tap-zone" style="position:fixed; bottom:0; left:0; right:0; height:120px; z-index:499;"></div>
</div>

<!-- BIBLE MODAL -->
<div id="bibleModal" class="modal-overlay">
    <div class="modal-sheet">
        <div class="modal-header">
            <h3 class="modal-title">Bíblia (Almeida)</h3>
            <button id="btn-bible-close" class="icon-btn" title="Fechar">
                <svg class="icon"><use href="#icon-x"></use></svg>
            </button>
        </div>

        <div class="bible-controls">
            <select id="bibleBook" class="bible-select"></select>
            <select id="bibleChapter" class="bible-select"></select>
        </div>

        <div id="bibleText" class="bible-text-area">
            <div style="color:var(--text-muted); text-align:center; margin-top:40px; font-family:var(--font-ui);">
                Selecione um livro e capítulo acima.
            </div>
        </div>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal-overlay">
    <div class="modal-sheet">
        <div class="modal-header">
            <h3 class="modal-title">Configurações</h3>
            <button id="btn-settings-close" class="icon-btn" title="Fechar">
                <svg class="icon"><use href="#icon-x"></use></svg>
            </button>
        </div>

        <div class="settings-row">
            <span>Modo Escuro</span>
            <button id="btn-theme" class="icon-btn" title="Alternar tema">
                <svg class="icon"><use href="#icon-moon"></use></svg>
            </button>
        </div>

        <div class="settings-row">
            <span>Backup (Download JSON)</span>
            <button id="btn-backup-dl" class="btn" style="background:var(--border); padding:8px 16px;">Baixar</button>
        </div>

        <div class="settings-row">
            <span>Restaurar Backup</span>
            <button id="btn-backup-restore" class="btn" style="background:var(--border); padding:8px 16px;">Upload</button>
            <input type="file" id="fileInput" accept=".json" hidden>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
