<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f59e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CifraPro">
<title>CifraPro</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header id="app-header">
    <button id="header-back" onclick="App.goBack()" aria-label="Voltar">&#8592;</button>
    <h1 id="header-title">🎸 CifraPro</h1>
    <div id="header-actions"></div>
  </header>

  <!-- SCREENS -->
  <div id="screens">

    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-icon">🎵</span>
          <span class="stat-value" id="stat-songs">0</span>
          <span class="stat-label">Cifras salvas</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">📋</span>
          <span class="stat-value" id="stat-setlists">0</span>
          <span class="stat-label">Listas criadas</span>
        </div>
      </div>

      <div>
        <p class="section-title">Ações rápidas</p>
        <div class="quick-actions">
          <button class="quick-action" onclick="App.nav('search')">
            <span class="qa-icon">🔍</span>
            <span class="qa-label">Buscar cifra</span>
          </button>
          <button class="quick-action" onclick="App.nav('library')">
            <span class="qa-icon">📚</span>
            <span class="qa-label">Minha biblioteca</span>
          </button>
          <button class="quick-action" onclick="App.nav('setlists')">
            <span class="qa-icon">🎼</span>
            <span class="qa-label">Nova lista</span>
          </button>
          <button class="quick-action" onclick="App.openManualImport()">
            <span class="qa-icon">✏️</span>
            <span class="qa-label">Importar texto</span>
          </button>
        </div>
      </div>

      <div id="home-recent" style="display:none">
        <p class="section-title">Recentes</p>
        <div id="home-recent-list" class="flex flex-col gap-8"></div>
      </div>
    </section>

    <!-- SEARCH -->
    <section id="screen-search" class="screen">
      <div class="search-tabs">
        <button class="search-tab active" id="tab-search" onclick="App.switchSearchTab('search')">Buscar online</button>
        <button class="search-tab" id="tab-batch" onclick="App.switchSearchTab('batch')">Baixar lista</button>
        <button class="search-tab" id="tab-manual" onclick="App.switchSearchTab('manual')">Colar texto</button>
      </div>

      <!-- Search tab -->
      <div id="search-pane">
        <div class="flex gap-8">
          <div class="input-group" style="flex:1">
            <label>Música</label>
            <input type="text" id="search-song" placeholder="Ex: Reckless Love" autocomplete="off">
          </div>
        </div>
        <div class="input-group">
          <label>Artista (opcional)</label>
          <input type="text" id="search-artist" placeholder="Ex: Cory Asbury" autocomplete="off">
        </div>
        <button class="btn btn-primary btn-full" onclick="App.searchOnline()">
          🔍 Buscar no Cifra Club
        </button>
        <div id="search-results-area"></div>
      </div>

      <!-- Batch tab -->
      <div id="batch-pane" style="display:none">
        <div class="import-help">
          Cole uma lista de músicas (uma por linha).<br>
          Formato: <strong>Artista - Música</strong> ou só o nome da música.
        </div>
        <div class="input-group">
          <label>Lista de músicas</label>
          <textarea id="batch-list" placeholder="Hillsong - What a Beautiful Name&#10;Diante do Trono - Quão Grande&#10;Gabriela Rocha - Aclame"></textarea>
        </div>
        <button class="btn btn-primary btn-full" onclick="App.startBatchDownload()">
          ⬇️ Baixar todas
        </button>
        <div id="batch-progress-area"></div>
      </div>

      <!-- Manual tab -->
      <div id="manual-pane" style="display:none">
        <div class="input-group">
          <label>Título da música</label>
          <input type="text" id="manual-title" placeholder="Nome da música" autocomplete="off">
        </div>
        <div class="input-group">
          <label>Artista</label>
          <input type="text" id="manual-artist" placeholder="Nome do artista" autocomplete="off">
        </div>
        <div class="input-group">
          <label>Tom</label>
          <select id="manual-key">
            <option value="C">C (Dó)</option>
            <option value="C#">C# (Dó#)</option>
            <option value="D">D (Ré)</option>
            <option value="D#">D# (Ré#)</option>
            <option value="E">E (Mi)</option>
            <option value="F">F (Fá)</option>
            <option value="F#">F# (Fá#)</option>
            <option value="G" selected>G (Sol)</option>
            <option value="G#">G# (Sol#)</option>
            <option value="A">A (Lá)</option>
            <option value="A#">A# (Lá#)</option>
            <option value="B">B (Si)</option>
          </select>
        </div>
        <div class="input-group">
          <label>Cifra (cole o texto da cifra aqui)</label>
          <textarea id="manual-content" placeholder="Cole a cifra aqui..." style="min-height:200px; font-family: monospace; font-size:0.85rem;"></textarea>
        </div>
        <button class="btn btn-primary btn-full" onclick="App.saveManualImport()">
          💾 Salvar cifra
        </button>
      </div>
    </section>

    <!-- LIBRARY -->
    <section id="screen-library" class="screen">
      <div class="search-input-wrap">
        <span class="search-input-icon">🔍</span>
        <input type="text" id="library-search" placeholder="Buscar na biblioteca..." oninput="App.filterLibrary(this.value)">
      </div>
      <div class="flex justify-between items-center">
        <span id="library-count" class="text-sm text-muted"></span>
        <select id="library-sort" onchange="App.sortLibrary(this.value)" style="width:auto; font-size:0.8rem; padding:6px 30px 6px 10px;">
          <option value="title">A→Z</option>
          <option value="artist">Artista</option>
          <option value="date">Mais recentes</option>
          <option value="key">Tom</option>
        </select>
      </div>
      <div id="library-list" class="flex flex-col gap-8"></div>
    </section>

    <!-- SONG VIEW -->
    <section id="screen-song" class="screen">
      <div class="song-header" id="song-header">
        <div class="song-header-title" id="song-title">—</div>
        <div class="song-header-artist" id="song-artist">—</div>

        <div class="transpose-bar">
          <button class="transpose-btn" onclick="App.transposeBy(-1)" title="-1 semitom">♭</button>
          <button class="transpose-btn" onclick="App.transposeBy(-2)" style="font-size:0.75rem">−2</button>
          <div>
            <div class="transpose-key" id="current-key">G</div>
            <div class="semitone-diff" id="semitone-diff"></div>
          </div>
          <button class="transpose-btn" onclick="App.transposeBy(2)" style="font-size:0.75rem">+2</button>
          <button class="transpose-btn" onclick="App.transposeBy(1)" title="+1 semitom">♯</button>
        </div>

        <div class="key-selector" id="key-selector"></div>
      </div>

      <div class="song-actions">
        <button class="btn btn-secondary btn-sm" onclick="App.toggleEdit()">✏️ Editar</button>
        <button class="btn btn-secondary btn-sm" onclick="App.openDisplayMode()">🖥️ Exibição</button>
        <button class="btn btn-secondary btn-sm" onclick="App.addToSetlistModal()">📋 Lista</button>
        <button class="btn btn-secondary btn-sm" onclick="App.saveTransposedKey()">💾 Salvar tom</button>
        <button class="btn btn-danger btn-sm" onclick="App.deleteSong()">🗑️</button>
      </div>

      <!-- View mode -->
      <div class="chord-content" id="chord-view">
        <div class="chord-text" id="chord-display"></div>
      </div>

      <!-- Edit mode -->
      <div id="chord-edit-area" style="display:none">
        <div class="input-group">
          <label>Título</label>
          <input type="text" id="edit-title">
        </div>
        <div class="input-group">
          <label>Artista</label>
          <input type="text" id="edit-artist">
        </div>
        <div class="input-group">
          <label>Tom base</label>
          <select id="edit-key">
            <option value="C">C</option><option value="C#">C#</option>
            <option value="D">D</option><option value="D#">D#</option>
            <option value="E">E</option><option value="F">F</option>
            <option value="F#">F#</option><option value="G">G</option>
            <option value="G#">G#</option><option value="A">A</option>
            <option value="A#">A#</option><option value="B">B</option>
          </select>
        </div>
        <div class="input-group">
          <label>Cifra</label>
          <textarea id="edit-content" class="chord-edit-area"></textarea>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-primary" onclick="App.saveEdit()">💾 Salvar</button>
          <button class="btn btn-ghost" onclick="App.cancelEdit()">Cancelar</button>
        </div>
      </div>
    </section>

    <!-- DISPLAY MODE -->
    <section id="screen-display" class="screen">
      <div class="display-header" id="display-header">
        <div>
          <div class="display-song-title" id="display-title"></div>
          <div class="display-song-key" id="display-key-label"></div>
        </div>
        <div class="display-controls">
          <button class="display-ctrl-btn" onclick="App.displayFontDown()">A−</button>
          <button class="display-ctrl-btn" onclick="App.displayFontUp()">A+</button>
          <button class="display-ctrl-btn" id="btn-two-col" onclick="App.toggleTwoCol()">⊞</button>
          <button class="display-ctrl-btn" id="btn-autoscroll" onclick="App.toggleAutoScroll()">▶</button>
          <button class="display-ctrl-btn" onclick="App.closeDisplay()">✕</button>
        </div>
      </div>
      <div id="display-content">
        <div id="display-chord-text"></div>
      </div>
      <div id="scroll-progress" style="width:0%"></div>
    </section>

    <!-- SETLISTS -->
    <section id="screen-setlists" class="screen">
      <button class="btn btn-primary btn-full" onclick="App.newSetlistModal()">
        ＋ Nova lista / culto
      </button>
      <div id="setlists-list" class="flex flex-col gap-8"></div>
    </section>

    <!-- SETLIST VIEW -->
    <section id="screen-setlist-view" class="screen">
      <div class="card card-padded" id="setlist-view-header">
        <div style="font-size:1.2rem; font-weight:700;" id="sv-name"></div>
        <div class="flex gap-8 mt-8" style="flex-wrap:wrap">
          <span class="badge badge-purple" id="sv-minister"></span>
          <span class="badge badge-info" id="sv-date"></span>
          <span class="badge" id="sv-count"></span>
        </div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-secondary btn-sm" onclick="App.addSongToSetlist()">＋ Adicionar música</button>
        <button class="btn btn-secondary btn-sm" onclick="App.displaySetlist()">🖥️ Exibir</button>
        <button class="btn btn-danger btn-sm" onclick="App.deleteCurrentSetlist()">🗑️</button>
      </div>
      <div id="setlist-songs-list" class="flex flex-col gap-8"></div>
    </section>

  </div><!-- /screens -->

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="App.nav('home')">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
    </button>
    <button class="nav-btn" id="nav-search" onclick="App.nav('search')">
      <span class="nav-icon">🔍</span>
      <span>Buscar</span>
    </button>
    <button class="nav-btn" id="nav-library" onclick="App.nav('library')">
      <span class="nav-icon">📚</span>
      <span>Biblioteca</span>
    </button>
    <button class="nav-btn" id="nav-setlists" onclick="App.nav('setlists')">
      <span class="nav-icon">🎼</span>
      <span>Listas</span>
    </button>
  </nav>

  <!-- TOAST -->
  <div id="toast-container"></div>

  <!-- MODAL BACKDROP -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="App.closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modal-title"></div>
      <div id="modal-body"></div>
    </div>
  </div>

</div><!-- /app -->

<script src="app.js"></script>
</body>
</html>
