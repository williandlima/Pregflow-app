<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PregFlow Pro — Desktop Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
body {
  margin:0; font-family:'Inter',sans-serif;
  background:#F5F6F7; color:#111827;
}
header {display:flex;justify-content:space-between;align-items:center;padding:20px;}
h1 {margin:0;font-size:28px;}
.sermon-list {padding:20px;display:flex;flex-direction:column;gap:12px;}
.sermon-card {
  background:#fff; border:1px solid #E5E7EB; border-radius:8px;
  padding:16px; cursor:pointer; transition:.2s;
}
.sermon-card:hover {border-color:#7C3AED;transform:translateY(-2px);}
.fab-main {
  position:fixed;bottom:20px;right:20px;
  width:56px;height:56px;border-radius:16px;
  background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:28px;cursor:pointer;
}
</style>
</head>
<body>

<header>
  <h1>PregFlow Pro</h1>
  <button id="toggleThemeBtn">Tema</button>
</header>

<div id="sermonList" class="sermon-list"></div>

<button class="fab-main" id="fabCreateBtn">+</button>

<script>
const el = id => document.getElementById(id);
let sermons = [];

function loadStorage(){
  const raw = localStorage.getItem('pregflow.sermons');
  if(raw){ sermons = JSON.parse(raw); }
  else {
    sermons = [{id:"demo",title:"Graça que Transforma",ref:"Efésios 2:8-10",updatedAt:Date.now()}];
  }
}
function saveStorage(){ localStorage.setItem('pregflow.sermons',JSON.stringify(sermons)); }

function renderList(){
  const wrap = el('sermonList');
  wrap.innerHTML = "";
  sermons.forEach(s=>{
    const card = document.createElement('div');
    card.className="sermon-card";
    card.textContent = s.title+" — "+s.ref;
    wrap.appendChild(card);
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  loadStorage();
  renderList();

  el('fabCreateBtn').addEventListener('click',()=>{
    const id="s_"+Math.random().toString(36).slice(2,9);
    sermons.push({id,title:"Novo Sermão",ref:"Referência",updatedAt:Date.now()});
    saveStorage();
    renderList();
  });

  el('toggleThemeBtn').addEventListener('click',()=>{
    document.body.classList.toggle('dark');
  });
});
</script>
</body>
</html>
