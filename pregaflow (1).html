<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PregaFlow Ultimate v3</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-body: #F9FAFB;
            --bg-surface: #FFFFFF;
            --bg-toolbar: rgba(255, 255, 255, 0.95);
            
            /* Cores dos Blocos no Editor */
            --bg-block-highlight: #FFFBEB; /* Amarelo bem claro */
            --border-block-highlight: #FCD34D;
            --bg-block-scripture: #F3F4F6;
            
            --txt-primary: #1F2937;
            --txt-secondary: #6B7280;
            --txt-accent: #4F46E5;
            --border: #E5E7EB;
            
            --radius: 12px;
            --font-ui: 'Inter', sans-serif;
            --font-reading: 'Merriweather', serif;
        }

        body.dark {
            --bg-body: #111827;
            --bg-surface: #1F2937;
            --bg-toolbar: rgba(31, 41, 55, 0.95);
            --bg-block-highlight: #422006; /* Marrom escuro */
            --border-block-highlight: #B45309;
            --bg-block-scripture: #374151;
            
            --txt-primary: #F3F4F6;
            --txt-secondary: #9CA3AF;
            --txt-accent: #818CF8;
            --border: #374151;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg-body); color: var(--txt-primary); font-family: var(--font-ui); margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .btn { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px; color: var(--txt-secondary); display: flex; align-items: center; justify-content: center; }
        .btn:hover { background: var(--border); color: var(--txt-primary); }
        .btn-primary { background: var(--txt-primary); color: var(--bg-surface); padding: 12px; border-radius: var(--radius); width: 100%; font-weight: 600; display: flex; justify-content: center; gap: 8px; }

        /* HEADER */
        header { height: 60px; padding: 0 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; color: var(--txt-primary); }

        /* LISTA */
        #view-list { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .card:hover { border-color: var(--txt-accent); }

        /* EDITOR */
        #view-editor { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-surface); }
        .editor-content { flex: 1; overflow-y: auto; padding: 30px 20px 100px 20px; max-width: 768px; margin: 0 auto; width: 100%; }

        .meta-area { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .input-title { font-size: 28px; font-weight: 800; width: 100%; border: none; margin-bottom: 10px; background: transparent; color: var(--txt-primary); }
        .input-ref { font-size: 16px; color: var(--txt-secondary); width: 100%; border: none; background: transparent; }
        
        /* BLOCOS - EDITOR */
        .block { position: relative; padding: 4px 0; margin-bottom: 8px; border-left: 3px solid transparent; padding-left: 12px; }
        .block.focused { border-color: var(--txt-accent); }
        
        .editable { min-height: 24px; outline: none; font-size: 17px; line-height: 1.6; color: var(--txt-primary); }
        .editable:empty:before { content: attr(placeholder); color: var(--txt-secondary); opacity: 0.5; pointer-events: none; display: block; }

        /* H1 */
        .block[data-type="h1"] .editable { font-size: 24px; font-weight: 800; }
        
        /* CITAÇÃO */
        .block[data-type="scripture"] { background: var(--bg-block-scripture); border-radius: 8px; padding: 16px; border-left: 4px solid var(--txt-accent); }
        .block[data-type="scripture"] .editable { font-family: var(--font-reading); font-style: italic; }

        /* DESTAQUE (HIGHLIGHT) - VISUAL NO EDITOR */
        .block[data-type="highlight"] { 
            background: var(--bg-block-highlight); 
            border: 1px solid var(--border-block-highlight);
            border-radius: 8px; 
            padding: 20px; 
            text-align: center; 
        }
        .block[data-type="highlight"] .editable { 
            font-weight: 700; 
            font-size: 18px; 
            /* Importante: NÃO definimos cor fixa aqui para permitir override manual */
        }

        /* TOOLBAR */
        .toolbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-toolbar); border-top: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 6px; align-items: center; overflow-x: auto; z-index: 50; }
        .v-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
        
        /* CORES PALETTE */
        .color-popover { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: none; gap: 10px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .color-popover.open { display: flex; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; }

        /* MODO PÚLPITO (DISPLAY) - CORREÇÕES */
        #view-reading {
            position: fixed; inset: 0; background: #000; color: #fff;
            z-index: 200; padding: 80px 20px 40px 20px; overflow-y: auto;
            display: none; font-size: 28px; line-height: 1.6;
        }
        #view-reading.active { display: block; }
        
        .pulpit-controls { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; z-index: 210; }
        
        .reading-block { margin-bottom: 30px; max-width: 900px; margin-left: auto; margin-right: auto; color: #E5E7EB; /* Cor padrão off-white */ }
        
        /* Título - Branco por padrão, mas aceita cor */
        .reading-h1 { 
            font-size: 1.6em; font-weight: 800; margin-bottom: 24px; 
            border-bottom: 2px solid #333; padding-bottom: 8px; margin-top: 50px;
            color: #FFFFFF; /* Padrão */
        }

        /* Scripture - Padrão verde água */
        .reading-block[data-type="scripture"] { 
            font-family: var(--font-reading); font-style: italic; 
            border-left: 5px solid #059669; padding-left: 24px; 
            color: #A7F3D0; /* Padrão */
        }
        
        /* DESTAQUE CORRIGIDO NO PÚLPITO */
        .reading-block[data-type="highlight"] {
            /* Fundo Gradiente */
            background: linear-gradient(135deg, #451a03 0%, #000 100%);
            border: 1px solid #d97706;
            border-left: 6px solid #fbbf24;
            padding: 30px 40px;
            border-radius: 8px 24px 8px 24px;
            text-align: center;
            font-size: 1.4em;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Importante: NÃO forçar cor de texto aqui. Deixar herdar ou usar padrão */
            color: #fbbf24; /* Amarelo Ouro como padrão SE não tiver cor manual */
        }
        
        /* GARANTIR QUE CORES MANUAIS FUNCIONEM */
        /* Essas classes vêm do execCommand ou style tag */
        #reading-content font, #reading-content span {
            /* Força a cor definida inline a sobrepor o CSS padrão */
        }

        /* MODAL E UTILITARIOS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal-card { background: var(--bg-surface); width: 100%; max-width: 600px; height: 70vh; border-radius: 20px; display: flex; flex-direction: column; }
        .verse-item { padding: 14px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div id="view-list">
        <header style="position: sticky; top: 0; margin: -20px -20px 20px -20px; padding: 0 20px;">
            <div class="brand"><i data-lucide="book-open"></i> PregaFlow v3</div>
            <button class="btn" onclick="App.toggleTheme()"><i data-lucide="moon"></i></button>
        </header>
        <button class="btn-primary" onclick="App.createSermon()"><i data-lucide="plus-circle"></i> Novo Esboço</button>
        <div id="sermon-list" style="margin-top: 20px;"></div>
    </div>

    <div id="view-editor" class="hidden">
        <header>
            <button class="btn" onclick="App.showList()"><i data-lucide="arrow-left"></i></button>
            <div class="flex gap-2">
                <button class="btn" onclick="App.toggleTheme()"><i data-lucide="moon"></i></button>
                <div class="v-sep"></div>
                <button class="btn" onclick="Pulpit.enter()" title="Modo Púlpito"><i data-lucide="monitor-play"></i></button>
                <button class="btn" onclick="Bible.open()" title="Bíblia"><i data-lucide="book"></i></button>
            </div>
        </header>

        <div class="editor-content" id="editor-canvas">
            <div class="meta-area">
                <input type="text" id="meta-title" class="input-title" placeholder="Título da Mensagem" oninput="App.save()">
                <input type="text" id="meta-ref" class="input-ref" placeholder="Referência (ex: João 3:16)" oninput="App.save()">
            </div>
            <div id="blocks-container"></div>
            <div style="height:100px; text-align:center; opacity:0.3; padding-top:20px;">Fim</div>
        </div>

        <div class="toolbar">
            <button class="btn" onclick="App.moveBlock(-1)"><i data-lucide="arrow-up"></i></button>
            <button class="btn" onclick="App.moveBlock(1)"><i data-lucide="arrow-down"></i></button>
            <div class="v-sep"></div>
            <button class="btn" onclick="App.addBlock('text')"><i data-lucide="plus"></i></button>
            <button class="btn" onclick="App.setBlockType('h1')">H1</button>
            <button class="btn" onclick="App.setBlockType('scripture')"><i data-lucide="quote"></i></button>
            <button class="btn" onclick="App.setBlockType('highlight')"><i data-lucide="highlighter"></i></button>
            <div class="v-sep"></div>
            <button class="btn" onmousedown="event.preventDefault(); App.format('bold')"><i data-lucide="bold"></i></button>
            <button class="btn" onmousedown="event.preventDefault(); App.format('italic')"><i data-lucide="italic"></i></button>
            <button class="btn" onmousedown="event.preventDefault(); App.toggleColors()"><i data-lucide="palette"></i></button>
            <div class="v-sep"></div>
            <button class="btn" onclick="App.deleteBlock()" style="color:#EF4444"><i data-lucide="trash-2"></i></button>
        </div>

        <div id="color-popover" class="color-popover">
            <div class="color-dot" style="background:var(--txt-primary); border:1px solid #999" onclick="App.setColor('inherit')" title="Padrão"></div>
            <div class="color-dot" style="background:#F87171" onclick="App.setColor('#F87171')" title="Vermelho Claro"></div>
            <div class="color-dot" style="background:#60A5FA" onclick="App.setColor('#60A5FA')" title="Azul Claro"></div>
            <div class="color-dot" style="background:#34D399" onclick="App.setColor('#34D399')" title="Verde Claro"></div>
            <div class="color-dot" style="background:#FBBF24" onclick="App.setColor('#FBBF24')" title="Amarelo Ouro"></div>
            <div class="color-dot" style="background:#A78BFA" onclick="App.setColor('#A78BFA')" title="Roxo Claro"></div>
        </div>
    </div>

    <div id="view-reading">
        <div class="pulpit-controls">
            <div style="color:white; font-weight:bold" id="timer" onclick="Pulpit.toggleTimer()">00:00</div>
            <button class="btn" style="background:#333; color:white" onclick="Pulpit.exit()">Sair</button>
        </div>
        <div id="reading-content" style="margin-top:20px"></div>
    </div>

    <div id="bible-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="padding:16px; border-bottom:1px solid #eee; display:flex; gap:10px">
                <select id="bible-book" style="flex:1; padding:10px" onchange="Bible.loadChapters()"></select>
                <select id="bible-chapter" style="width:80px; padding:10px" onchange="Bible.loadVerses()"></select>
                <button onclick="Bible.close()">✕</button>
            </div>
            <div id="bible-results" style="flex:1; overflow-y:auto; padding:16px"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const DB_KEY = 'pregaflow_v3';
        let currentSermonId = null;
        let focusedBlock = null;

        const Store = {
            getAll: () => JSON.parse(localStorage.getItem(DB_KEY) || '[]'),
            saveAll: (data) => localStorage.setItem(DB_KEY, JSON.stringify(data)),
            get: (id) => Store.getAll().find(x => x.id === id),
            update: (id, payload) => {
                const all = Store.getAll();
                const idx = all.findIndex(x => x.id === id);
                if (idx !== -1) {
                    all[idx] = { ...all[idx], ...payload, updatedAt: Date.now() };
                    Store.saveAll(all);
                }
            }
        };

        const App = {
            init: () => {
                App.renderList();
                if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
                new Sortable(document.getElementById('blocks-container'), { animation: 150, handle: '.block', onEnd: () => App.save() });
            },

            toggleTheme: () => {
                document.body.classList.toggle('dark');
                localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
            },

            renderList: () => {
                const list = Store.getAll();
                document.getElementById('sermon-list').innerHTML = list.map(s => `
                    <div class="card" onclick="App.openSermon('${s.id}')">
                        <h3>${s.title || 'Sem Título'}</h3>
                        <p>${s.bibleRef || 'Sem referência'}</p>
                    </div>`).join('');
            },

            createSermon: () => {
                const id = 's_' + Date.now();
                const all = Store.getAll();
                all.unshift({ id, title: '', bibleRef: '', updatedAt: Date.now(), blocks: [{id: 'b_'+Date.now(), type: 'text', content: ''}] });
                Store.saveAll(all);
                App.openSermon(id);
            },

            openSermon: (id) => {
                currentSermonId = id;
                const s = Store.get(id);
                document.getElementById('view-list').classList.add('hidden');
                document.getElementById('view-editor').classList.remove('hidden');
                document.getElementById('meta-title').value = s.title;
                document.getElementById('meta-ref').value = s.bibleRef;
                document.getElementById('blocks-container').innerHTML = '';
                s.blocks.forEach(b => App.renderBlock(b));
            },

            renderBlock: (data, afterElement = null) => {
                const div = document.createElement('div');
                div.className = `block`;
                div.dataset.id = data.id;
                div.dataset.type = data.type || 'text';
                // Preserva o HTML exato (incluindo cores)
                div.innerHTML = `<div class="editable" contenteditable="true" placeholder="Escreva...">${data.content}</div>`;
                
                const edit = div.querySelector('.editable');
                edit.onfocus = () => App.setFocus(div);
                edit.onblur = () => { div.classList.remove('focused'); App.save(); };
                edit.onkeydown = (e) => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); App.addBlock('text', div); }};

                const container = document.getElementById('blocks-container');
                if(afterElement) container.insertBefore(div, afterElement.nextSibling); else container.appendChild(div);
            },

            addBlock: (type = 'text', afterBlock = null) => {
                const ref = afterBlock || focusedBlock || document.getElementById('blocks-container').lastElementChild;
                App.renderBlock({id: 'b_'+Date.now(), type, content: ''}, ref);
            },

            setFocus: (div) => {
                document.querySelectorAll('.block').forEach(b => b.classList.remove('focused'));
                div.classList.add('focused');
                focusedBlock = div;
                document.getElementById('color-popover').classList.remove('open');
            },

            moveBlock: (dir) => {
                if(!focusedBlock) return;
                const sibling = dir === -1 ? focusedBlock.previousElementSibling : focusedBlock.nextElementSibling;
                if(sibling) { 
                    dir === -1 ? sibling.before(focusedBlock) : sibling.after(focusedBlock);
                    focusedBlock.scrollIntoView({behavior:'smooth', block:'center'});
                    focusedBlock.querySelector('.editable').focus();
                    App.save();
                }
            },

            // FORMATAÇÃO E CORES
            format: (cmd) => { document.execCommand(cmd, false, null); },
            toggleColors: () => { document.getElementById('color-popover').classList.toggle('open'); },
            setColor: (color) => {
                // Remove cor anterior se 'inherit'
                if(color === 'inherit') document.execCommand('removeFormat', false, 'foreColor');
                else document.execCommand('foreColor', false, color);
                document.getElementById('color-popover').classList.remove('open');
            },
            setBlockType: (type) => { if(focusedBlock){ focusedBlock.dataset.type = type; App.save(); } },
            deleteBlock: () => { if(focusedBlock && confirm('Apagar?')) { focusedBlock.remove(); focusedBlock=null; App.save(); } },

            save: () => {
                if(!currentSermonId) return;
                const blocks = [];
                document.querySelectorAll('.block').forEach(el => {
                    blocks.push({
                        id: el.dataset.id, type: el.dataset.type,
                        content: el.querySelector('.editable').innerHTML // Salva HTML com cores
                    });
                });
                Store.update(currentSermonId, { 
                    title: document.getElementById('meta-title').value, 
                    bibleRef: document.getElementById('meta-ref').value, 
                    blocks 
                });
            },

            showList: () => {
                document.getElementById('view-editor').classList.add('hidden');
                document.getElementById('view-list').classList.remove('hidden');
                App.renderList();
            }
        };

        const Pulpit = {
            timerInterval: null, sec: 0,
            enter: async () => {
                if(!currentSermonId) return;
                App.save();
                const s = Store.get(currentSermonId);
                const content = document.getElementById('reading-content');
                
                // Título sempre branco no modo púlpito, ref cinza
                let html = `<div style="font-size:2em; font-weight:800; margin-bottom:10px; color:white">${s.title}</div>`;
                html += `<div style="color:#aaa; font-size:0.9em; margin-bottom:50px; border-bottom:1px solid #333; padding-bottom:20px;">${s.bibleRef}</div>`;
                
                s.blocks.forEach(b => {
                    // Aqui está o segredo: injetamos o HTML salvo (que tem as cores)
                    // mas envolvemos nas classes que dão o layout (fundo, borda, tamanho)
                    if(b.type === 'h1') {
                        html += `<div class="reading-h1">${b.content}</div>`;
                    } else {
                        html += `<div class="reading-block" data-type="${b.type}">${b.content}</div>`;
                    }
                });
                
                content.innerHTML = html;
                document.getElementById('view-reading').classList.add('active');
                try { if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
            },
            exit: () => document.getElementById('view-reading').classList.remove('active'),
            toggleTimer: () => {
                if(Pulpit.timerInterval) { clearInterval(Pulpit.timerInterval); Pulpit.timerInterval=null; }
                else { Pulpit.timerInterval = setInterval(()=>{ Pulpit.sec++; document.getElementById('timer').innerText = new Date(Pulpit.sec * 1000).toISOString().substr(14, 5); }, 1000); }
            }
        };

        const Bible = {
            books: ["Gênesis","Êxodo","Levítico","Números","Deuteronômio","Josué","Juízes","Rute","1 Samuel","2 Samuel","1 Reis","2 Reis","1 Crônicas","2 Crônicas","Esdras","Neemias","Ester","Jó","Salmos","Provérbios","Eclesiastes","Cânticos","Isaías","Jeremias","Lamentações","Ezequiel","Daniel","Oséias","Joel","Amós","Obadias","Jonas","Miquéias","Naum","Habacuque","Sofonias","Ageu","Zacarias","Malaquias","Mateus","Marcos","Lucas","João","Atos","Romanos","1 Coríntios","2 Coríntios","Gálatas","Efésios","Filipenses","Colossenses","1 Tessalonicenses","2 Tessalonicenses","1 Timóteo","2 Timóteo","Tito","Filemom","Hebreus","Tiago","1 Pedro","2 Pedro","1 João","2 João","3 João","Judas","Apocalipse"],
            open: () => {
                document.getElementById('bible-modal').classList.add('open');
                const sel = document.getElementById('bible-book');
                if(sel.options.length===0) Bible.books.forEach(b => sel.add(new Option(b, b)));
                Bible.loadChapters();
            },
            close: () => document.getElementById('bible-modal').classList.remove('open'),
            loadChapters: () => {
                const sel = document.getElementById('bible-chapter'); sel.innerHTML='';
                for(let i=1;i<=150;i++) sel.add(new Option(i, i));
                Bible.loadVerses();
            },
            loadVerses: async () => {
                const div = document.getElementById('bible-results'); div.innerHTML='Carregando...';
                try {
                    const b = document.getElementById('bible-book').value.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const c = document.getElementById('bible-chapter').value;
                    const res = await fetch(`https://bible-api.com/${b}+${c}?translation=almeida`);
                    const data = await res.json();
                    div.innerHTML = data.verses.map(v => `
                        <div class="verse-item">
                            <div style="flex:1"><b>${v.verse}</b> ${v.text}</div>
                            <button class="btn" style="background:var(--txt-accent); color:white" onclick="Bible.insert('${b} ${c}:${v.verse}', '${v.text.replace(/'/g, "\\'")}')">Usar</button>
                        </div>`).join('');
                } catch(e) { div.innerHTML='Erro ao carregar.'; }
            },
            insert: (ref, text) => {
                App.addBlock('scripture');
                setTimeout(() => { 
                    const el = document.querySelector('.block:last-child .editable');
                    if(el) { el.innerText = `"${text}" (${ref})`; App.save(); Bible.close(); }
                }, 100);
            }
        };

        window.onload = App.init;
    </script>
</body>
</html>
