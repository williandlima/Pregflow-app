<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PregaFlow Studio Desktop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        /* --- VARIÁVEIS E RESET --- */
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Lora', serif;
            
            --bg-app: #F9FAFB;       /* Fundo geral do app */
            --bg-sidebar: #F3F4F6;   /* Fundo da barra lateral */
            --bg-paper: #FFFFFF;     /* Fundo da folha de edição */
            --bg-toolbar: #FFFFFF;   /* Fundo da toolbar */
            
            --txt-primary: #111827;
            --txt-secondary: #6B7280;
            --txt-tertiary: #9CA3AF;
            
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --danger: #EF4444;
            
            --border: #E5E7EB;
            --radius-sm: 6px;
            --radius-md: 8px;
            
            /* Sombras mais suaves para Desktop */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-paper: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-float: 0 10px 15px -3px rgba(0, 0, 0, 0.1);

            /* Cores de Destaque */
            --swatch-gray: #F3F4F6; --txt-gray: #374151;
            --swatch-blue: #EFF6FF; --txt-blue: #1D4ED8;
            --swatch-green: #ECFDF5; --txt-green: #047857;
            --swatch-red: #FEF2F2; --txt-red: #B91C1C;
            --swatch-amber: #FFFBEB; --txt-amber: #B45309;
        }

        * { box-sizing: border-box; outline: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

        body {
            background-color: var(--bg-app);
            color: var(--txt-primary);
            font-family: var(--font-sans);
            font-size: 15px; /* Levemente menor que mobile para mais densidade */
            line-height: 1.5;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LAYOUT GRID PRINCIPAL --- */
        #app {
            display: grid;
            grid-template-columns: 320px 1fr; /* Sidebar fixa | Editor flexível */
            height: 100vh;
            width: 100%;
            max-width: 100%;
            background: var(--bg-app);
        }

        .hidden { display: none !important; }
        .btn { cursor: pointer; border: none; background: none; font-family: inherit; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;}
        .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        
        /* --- COLUNA 1: SIDEBAR (LISTA) --- */
        #view-list {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-sidebar);
        }

        .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; color: var(--txt-primary); }
        
        .new-sermon-btn {
            margin: 15px 20px;
            background: var(--txt-primary); color: white;
            padding: 10px; border-radius: var(--radius-md);
            font-weight: 600; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s;
        }
        .new-sermon-btn:hover { background: #000; }

        #sermon-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 20px 10px;
        }

        .sermon-card {
            background: transparent; 
            border: 1px solid transparent;
            border-radius: var(--radius-md); 
            padding: 12px 15px; 
            margin-bottom: 4px;
            cursor: pointer; 
            position: relative;
            transition: all 0.2s;
        }
        .sermon-card:hover { background: rgba(255,255,255,0.6); border-color: var(--border); }
        .sermon-card.active { background: white; border-color: var(--border); box-shadow: var(--shadow-sm); }
        
        .card-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; color: var(--txt-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--txt-secondary); }
        
        .btn-delete-card {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
            color: var(--txt-tertiary); opacity: 0; padding: 6px; border-radius: 4px;
        }
        .sermon-card:hover .btn-delete-card { opacity: 1; }
        .btn-delete-card:hover { background: var(--swatch-red); color: var(--danger); }

        /* --- COLUNA 2: EDITOR --- */
        #view-editor {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-app); /* Fundo cinza claro atrás do papel */
            position: relative;
        }

        /* Header do Editor (Toolbar Principal) */
        .editor-header {
            height: 60px;
            padding: 0 30px;
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 20;
        }

        .save-status { font-size: 12px; font-weight: 500; color: var(--txt-green); display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 0.3s; }
        .save-status.visible { opacity: 1; }

        /* Container da Folha */
        .editor-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        /* A "Folha de Papel" */
        .paper-sheet {
            background: var(--bg-paper);
            width: 100%;
            max-width: 850px; /* Largura ideal para leitura */
            min-height: 100%; /* Ocupa altura se for curto */
            height: fit-content;
            padding: 60px 70px; /* Margens de documento A4 */
            box-shadow: var(--shadow-paper);
            border-radius: 2px;
            position: relative;
        }

        /* Inputs do cabeçalho */
        .meta-inputs { margin-bottom: 40px; border-bottom: 2px solid var(--border); padding-bottom: 20px; }
        .input-title { 
            font-size: 32px; font-weight: 800; margin-bottom: 10px; color: var(--txt-primary); 
            width: 100%; border: none; resize: none; font-family: var(--font-sans);
        }
        .input-ref { 
            font-size: 18px; font-weight: 500; color: var(--txt-secondary); 
            width: 100%; border: none; resize: none; font-family: var(--font-sans);
        }
        .input-title::placeholder, .input-ref::placeholder { color: #D1D5DB; }

        /* TOOLBAR DE FORMATAÇÃO (Agora no Topo/Sticky) */
        .formatting-toolbar {
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            padding: 8px 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100; /* Acima do texto ao rolar */
        }

        .tool-btn {
            width: 32px; height: 32px; border-radius: 4px;
            color: var(--txt-secondary);
            border: 1px solid transparent;
            font-size: 14px;
        }
        .tool-btn:hover { background: var(--swatch-gray); color: var(--txt-primary); }
        .tool-btn.active { background: var(--swatch-gray); color: var(--accent); border-color: #DBEAFE; }
        
        .tool-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }

        .color-dot { width: 18px; height: 18px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.active { border-color: var(--txt-primary); }

        /* BLOCOS */
        #blocks-container { display: flex; flex-direction: column; gap: 10px; }
        
        .block-wrapper {
            position: relative; display: flex; align-items: flex-start; gap: 12px;
            border-radius: 4px; transition: background 0.2s;
            padding: 4px 8px 4px 2px;
            border: 1px solid transparent;
        }
        .block-wrapper:hover { background: #F9FAFB; }
        .block-wrapper.focused { background: #F3F4F6; }
        
        .drag-handle {
            width: 20px; height: 24px; margin-top: 4px; cursor: grab; 
            color: #D1D5DB; opacity: 0; transition: opacity 0.2s;
        }
        .block-wrapper:hover .drag-handle { opacity: 1; }

        .block-content { flex: 1; }

        textarea {
            width: 100%; border: none; background: transparent; resize: none;
            font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
            padding: 2px 0; color: var(--txt-primary); overflow: hidden;
        }

        /* Estilos de Bloco */
        .block-wrapper[data-color="gray"] { color: var(--txt-gray); }
        .block-wrapper[data-color="blue"] { color: var(--txt-blue); }
        .block-wrapper[data-color="green"] { color: var(--txt-green); }
        .block-wrapper[data-color="red"] { color: var(--txt-red); }
        .block-wrapper[data-color="amber"] { color: var(--txt-amber); }
        
        .block-wrapper[data-format*="bold"] textarea { font-weight: 700; }
        .block-wrapper[data-format*="italic"] textarea { font-style: italic; }

        .block-wrapper[data-type="topic"] textarea { font-weight: 600; font-size: 18px; }
        .block-wrapper[data-type="topic"]::before {
            content: '•'; font-size: 24px; line-height: 1; margin-top: 0px; color: currentColor; margin-right: 8px;
        }
        .block-wrapper[data-type="scripture"] textarea {
            font-family: var(--font-serif); font-style: italic; font-size: 17px;
            padding: 10px 20px; border-left: 3px solid currentColor; background: rgba(0,0,0,0.02);
        }
        .block-wrapper[data-type="highlight"] textarea {
            font-size: 24px; font-weight: 800; text-align: center;
            background: var(--swatch-gray); color: var(--txt-primary); padding: 30px; border-radius: 8px;
        }
        .block-wrapper[data-type="note"] textarea {
            font-size: 14px; background: var(--swatch-amber); color: #92400E;
            padding: 12px; border-radius: 6px; border: 1px solid #FDE68A;
        }

        /* Botão flutuante para adicionar bloco (opcional, mas bom manter) */
        .btn-add-bottom {
            margin: 20px auto; display: block;
            background: var(--border); color: var(--txt-secondary);
            width: 100%; padding: 10px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 500;
        }
        .btn-add-bottom:hover { background: var(--txt-secondary); color: white; }


        /* --- MODO LEITURA (Fullscreen Overlay) --- */
        #reading-overlay {
            position: fixed; inset: 0; background: #111; z-index: 200;
            overflow-y: auto; padding: 40px; display: none;
        }
        #reading-overlay.active { display: block; }
        
        .reading-paper {
            max-width: 900px; margin: 0 auto; 
            background: #fff; padding: 80px; border-radius: 4px; min-height: 100vh;
        }
        .reading-block { margin-bottom: 24px; font-size: 28px; line-height: 1.6; color: #111; }
        .reading-block.type-title { font-size: 56px; font-weight: 900; margin-bottom: 20px; letter-spacing: -1px; }
        .reading-block.type-ref { font-size: 32px; color: #666; margin-bottom: 60px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        
        /* Ajustes Toast */
        .toast {
            position: fixed; bottom: 30px; right: 30px; left: auto; transform: none;
            background: #111; color: white; padding: 10px 20px; border-radius: 6px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 300;
        }

        /* Esconder botão de voltar no Desktop */
        .mobile-only { display: none !important; }
        
        .empty-editor-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--txt-tertiary); font-size: 18px;
        }

    </style>
</head>
<body>

<div id="app">
    
    <div id="toast" class="toast">Salvo</div>

    <div id="view-list">
        <div class="sidebar-header">
            <div class="brand">
                <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                PregaFlow Studio
            </div>
        </div>
        
        <button class="new-sermon-btn" onclick="App.createSermon()">
            <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Novo Esboço
        </button>

        <div id="sermon-list-container">
            </div>
    </div>

    <div id="view-editor" style="visibility: hidden;"> <div class="formatting-toolbar">
            <button class="tool-btn" title="Texto Normal" data-type="text" onclick="App.setBlockType('text')">Txt</button>
            <button class="tool-btn" title="Tópico" data-type="topic" onclick="App.setBlockType('topic')"><svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg></button>
            <button class="tool-btn" title="Versículo" data-type="scripture" onclick="App.setBlockType('scripture')"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path></svg></button>
            <button class="tool-btn" title="Destaque" data-type="highlight" onclick="App.setBlockType('highlight')"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></button>
            <button class="tool-btn" title="Nota" data-type="note" onclick="App.setBlockType('note')"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg></button>
            
            <div class="tool-sep"></div>
            
            <button class="tool-btn" title="Negrito" data-format="bold" onclick="App.setBlockFormat('bold')"><b>B</b></button>
            <button class="tool-btn" title="Itálico" data-format="italic" onclick="App.setBlockFormat('italic')"><i>I</i></button>

            <div class="tool-sep"></div>

            <div class="color-dot" style="background: #D1D5DB" data-color="gray" onclick="App.setBlockColor('gray')"></div>
            <div class="color-dot" style="background: #60A5FA" data-color="blue" onclick="App.setBlockColor('blue')"></div>
            <div class="color-dot" style="background: #34D399" data-color="green" onclick="App.setBlockColor('green')"></div>
            <div class="color-dot" style="background: #F87171" data-color="red" onclick="App.setBlockColor('red')"></div>
            <div class="color-dot" style="background: #FBBF24" data-color="amber" onclick="App.setBlockColor('amber')"></div>

            <div class="tool-sep"></div>

            <button class="tool-btn" onclick="App.moveBlock('up')" title="Mover Acima"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
            <button class="tool-btn" onclick="App.moveBlock('down')" title="Mover Abaixo"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></button>
            <button class="tool-btn" onclick="App.deleteBlock()" title="Excluir Bloco" style="color: var(--danger)"><svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
            
            <div style="flex:1"></div> <div class="save-status" id="save-indicator">
                <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><path d="M20 6L9 17l-5-5"/></svg> Salvo
            </div>
             <button class="btn action-btn" onclick="Reader.open()" title="Modo Púlpito (Tela Cheia)">
                <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 1-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            </button>
            <button class="btn action-btn" onclick="Exporter.generatePDF()" title="Exportar PDF" style="color: var(--accent); margin-left: 10px;">
                <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg>
            </button>
        </div>

        <div class="editor-scroll-area" id="editor-area">
            <div class="paper-sheet">
                <div class="meta-inputs">
                    <textarea id="edit-title" class="input-title" placeholder="Título da Mensagem..." rows="1" oninput="App.handleInput(this)"></textarea>
                    <textarea id="edit-ref" class="input-ref" placeholder="Texto Base / Referência..." rows="1" oninput="App.handleInput(this)"></textarea>
                </div>
                
                <div id="blocks-container"></div>
                
                <button class="btn-add-bottom" onclick="App.addBlock()">+ Adicionar Bloco de Texto</button>
            </div>
        </div>
    </div>

    <div id="reading-overlay" class="overlay">
        <button style="position:fixed; top:30px; right:30px; z-index:201; background:rgba(255,255,255,0.2); color:white; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer; border:1px solid rgba(255,255,255,0.3);" onclick="Reader.close()">✕ Sair do Púlpito</button>
        <div class="reading-paper">
            <div id="reading-container"></div>
        </div>
    </div>

</div>

<script>
/**
 * --- PREGAFLOW STUDIO DESKTOP JS ---
 */

// 1. STORAGE MODULE
const Store = {
    key: 'pregaflow_v2_data',
    get() {
        try { return JSON.parse(localStorage.getItem(this.key) || '[]'); } 
        catch (e) { console.error("Erro ler dados", e); return []; }
    },
    save(data) {
        localStorage.setItem(this.key, JSON.stringify(data));
    },
    update(id, payload) {
        const list = this.get();
        const idx = list.findIndex(i => i.id === id);
        if (idx !== -1) {
            list[idx] = { ...list[idx], ...payload, lastMod: Date.now() };
            this.save(list);
            return list[idx];
        }
        return null;
    },
    delete(id) {
        const list = this.get().filter(i => i.id !== id);
        this.save(list);
    }
};

// 2. UTILS
const Utils = {
    id: () => Date.now().toString(36) + Math.random().toString(36).substr(2),
    debounce: (func, wait) => {
        let timeout;
        return function(...args) {
            const context = this;
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(context, args), wait);
        };
    },
    toast: (msg) => {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2000);
    },
    getStylesForColor(colorId) {
        const map = {
            gray: { txt: '#374151', bg: '#F3F4F6' },
            blue: { txt: '#1D4ED8', bg: '#EFF6FF' },
            green: { txt: '#047857', bg: '#ECFDF5' },
            red: { txt: '#B91C1C', bg: '#FEF2F2' },
            amber: { txt: '#B45309', bg: '#FFFBEB' },
        };
        return map[colorId] || map['gray'];
    }
};

// 3. APP CONTROLLER
const App = {
    currentId: null,
    focusedBlockId: null,
    sortable: null,

    init() {
        this.renderList();
        
        // Configura Sortable para Drag and Drop
        const container = document.getElementById('blocks-container');
        this.sortable = Sortable.create(container, {
            handle: '.drag-handle',
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: () => this.saveFromDOM(true)
        });

        // Se houver itens, abre o primeiro automaticamente
        const list = Store.get();
        if(list.length > 0) {
            this.openSermon(list[0].id);
        } else {
            this.createSermon(); // Cria um novo se não houver nenhum
        }
    },
    
    renderList() {
        const list = Store.get();
        const container = document.getElementById('sermon-list-container');
        
        if(list.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color: #9CA3AF; font-size:13px;">Nenhum esboço encontrado</div>`;
            return;
        }

        container.innerHTML = list.map(s => `
            <div class="sermon-card ${s.id === this.currentId ? 'active' : ''}" onclick="App.openSermon('${s.id}')">
                <div class="card-title">${s.title || 'Esboço Sem Título'}</div>
                <div class="card-meta">
                    <span>${new Date(s.createdAt).toLocaleDateString('pt-BR')}</span>
                    <span>• ${s.bibleRef || '...'}</span>
                </div>
                <button class="btn btn-delete-card" onclick="App.deleteSermonWrapper(event, '${s.id}')" title="Excluir">
                    <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        `).join('');
    },
    
    deleteSermonWrapper(e, id) {
        if (e) e.stopPropagation();
        if (confirm('Tem certeza que deseja apagar este esboço?')) {
            Store.delete(id);
            if(this.currentId === id) {
                document.getElementById('view-editor').style.visibility = 'hidden';
                this.currentId = null;
            }
            this.renderList();
        }
    },

    createSermon() {
        const newSermon = {
            id: Utils.id(),
            title: '',
            bibleRef: '',
            createdAt: Date.now(),
            blocks: [{ id: Utils.id(), type: 'text', content: '', color: 'gray', isBold: false, isItalic: false }]
        };
        const list = Store.get();
        list.unshift(newSermon);
        Store.save(list);
        this.renderList();
        this.openSermon(newSermon.id);
    },

    openSermon(id) {
        // Salva o atual antes de mudar, se houver
        if(this.currentId && this.currentId !== id) {
            this.saveFromDOM(true); 
        }

        this.currentId = id;
        const sermon = Store.get().find(s => s.id === id);
        if(!sermon) return;

        // Atualiza UI da lista (active state)
        document.querySelectorAll('.sermon-card').forEach(c => c.classList.remove('active'));
        this.renderList(); // Re-render para aplicar classe active (simplificado)

        // Mostra editor
        document.getElementById('view-editor').style.visibility = 'visible';
        
        document.getElementById('edit-title').value = sermon.title;
        document.getElementById('edit-ref').value = sermon.bibleRef;
        
        this.adjustTextareas(document.getElementById('edit-title'));
        this.adjustTextareas(document.getElementById('edit-ref'));
        
        this.renderBlocks(sermon.blocks);
    },

    renderBlocks(blocks) {
        const container = document.getElementById('blocks-container');
        container.innerHTML = '';
        blocks.forEach(b => {
            container.appendChild(this.createBlockDOM(b));
        });
        this.adjustTextareas();
    },

    createBlockDOM(data) {
        const div = document.createElement('div');
        div.className = 'block-wrapper';
        div.id = `block-${data.id}`;
        div.dataset.id = data.id;
        div.dataset.type = data.type;
        div.dataset.color = data.color || 'gray';
        
        let formatStr = '';
        if (data.isBold) formatStr += 'bold';
        if (data.isItalic) formatStr += (formatStr ? ' ' : '') + 'italic';
        div.dataset.format = formatStr.trim();

        div.innerHTML = `
            <div class="drag-handle"><svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg></div>
            <div class="block-content">
                <textarea rows="1" placeholder="Digite algo..." onfocus="App.setFocus('${data.id}')" oninput="App.handleInput(this)">${data.content}</textarea>
            </div>
        `;
        return div;
    },

    setFocus(id) {
        this.focusedBlockId = id;
        document.querySelectorAll('.block-wrapper').forEach(el => el.classList.remove('focused'));
        const el = document.getElementById(`block-${id}`);
        if(el) el.classList.add('focused');
        
        this.updateToolbarState(el ? el.dataset : {});
    },
    
    updateToolbarState(dataset) {
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));

        if(dataset.type) {
            document.querySelector(`.tool-btn[data-type="${dataset.type}"]`)?.classList.add('active');
        }
        if(dataset.format && dataset.format.includes('bold')) {
            document.querySelector(`.tool-btn[data-format="bold"]`)?.classList.add('active');
        }
        if(dataset.format && dataset.format.includes('italic')) {
            document.querySelector(`.tool-btn[data-format="italic"]`)?.classList.add('active');
        }
        if(dataset.color) {
            document.querySelector(`.color-dot[data-color="${dataset.color}"]`)?.classList.add('active');
        }
    },

    addBlock() {
        const newBlock = { id: Utils.id(), type: 'text', content: '', color: 'gray', isBold: false, isItalic: false };
        const dom = this.createBlockDOM(newBlock);
        
        const container = document.getElementById('blocks-container');
        let reference = null;
        
        if (this.focusedBlockId) {
            reference = document.getElementById(`block-${this.focusedBlockId}`);
        }
        
        if (reference && reference.nextSibling) {
            container.insertBefore(dom, reference.nextSibling);
        } else {
            container.appendChild(dom);
        }
        
        dom.querySelector('textarea').focus();
        this.saveFromDOM();
    },

    deleteBlock() {
        if (!this.focusedBlockId) return;
        
        // Não pede confirmação se estiver vazio
        const el = document.getElementById(`block-${this.focusedBlockId}`);
        const text = el.querySelector('textarea').value;
        if(text.trim() !== '' && !confirm('Apagar bloco?')) return;
        
        const prev = el.previousElementSibling;
        const next = el.nextElementSibling;
        
        el.remove(); 
        this.focusedBlockId = null;

        let focusTarget = null;
        if (prev && prev.querySelector('textarea')) {
            focusTarget = prev.querySelector('textarea');
        } else if (next && next.querySelector('textarea')) {
            focusTarget = next.querySelector('textarea');
        }

        if(focusTarget) {
            focusTarget.focus();
            // Move cursor para o final
            const val = focusTarget.value; focusTarget.value = ''; focusTarget.value = val;
        } else {
            this.updateToolbarState({});
        }
        this.saveFromDOM(true);
    },

    moveBlock(direction) {
        if(!this.focusedBlockId) return;
        this.saveFromDOM(true); 

        const allData = Store.get().find(x => x.id === this.currentId);
        const blocks = allData.blocks;
        const idx = blocks.findIndex(b => b.id === this.focusedBlockId);
        
        if (direction === 'up' && idx > 0) {
            [blocks[idx], blocks[idx-1]] = [blocks[idx-1], blocks[idx]];
        } else if (direction === 'down' && idx < blocks.length - 1) {
            [blocks[idx], blocks[idx+1]] = [blocks[idx+1], blocks[idx]];
        } else { return; }
        
        Store.update(this.currentId, { blocks });
        
        this.renderBlocks(blocks);
        setTimeout(() => {
            const el = document.getElementById(`block-${this.focusedBlockId}`);
            if(el) {
                const ta = el.querySelector('textarea');
                ta.focus();
                App.setFocus(this.focusedBlockId);
            }
        }, 50);
    },

    setBlockType(type) {
        if(!this.focusedBlockId) return;
        const el = document.getElementById(`block-${this.focusedBlockId}`);
        el.dataset.type = type;
        this.saveFromDOM();
        this.setFocus(this.focusedBlockId);
    },
    
    setBlockFormat(format) {
        if(!this.focusedBlockId) return;
        const el = document.getElementById(`block-${this.focusedBlockId}`);
        let currentFormat = el.dataset.format || "";
        const isActive = currentFormat.includes(format);
        
        if (isActive) {
            currentFormat = currentFormat.replace(format, '').trim();
        } else {
            currentFormat = (currentFormat + ' ' + format).trim();
        }
        
        el.dataset.format = currentFormat;
        this.saveFromDOM();
        this.setFocus(this.focusedBlockId);
    },

    setBlockColor(color) {
        if(!this.focusedBlockId) return;
        const el = document.getElementById(`block-${this.focusedBlockId}`);
        el.dataset.color = color;
        this.saveFromDOM();
        this.setFocus(this.focusedBlockId);
    },

    adjustTextareas(target) {
        const targets = target ? [target] : document.querySelectorAll('#view-editor textarea');
        targets.forEach(tx => {
            tx.style.height = 'auto';
            tx.style.height = (tx.scrollHeight) + 'px';
        });
    },

    handleInput: Utils.debounce(function(target) {
        App.adjustTextareas(target);
        App.saveFromDOM();
        // Atualiza título na lista lateral em tempo real
        if(target.id === 'edit-title') {
            App.renderList();
        }
    }, 400),

    saveFromDOM(skipFeedback = false) {
        if(!this.currentId) return;
        
        const title = document.getElementById('edit-title').value;
        const ref = document.getElementById('edit-ref').value;
        
        const blocks = [];
        document.querySelectorAll('.block-wrapper').forEach(el => {
            blocks.push({
                id: el.dataset.id,
                type: el.dataset.type,
                color: el.dataset.color,
                content: el.querySelector('textarea').value,
                isBold: el.dataset.format.includes('bold'),
                isItalic: el.dataset.format.includes('italic')
            });
        });

        Store.update(this.currentId, { title, bibleRef: ref, blocks });
        
        if (!skipFeedback) {
            const indicator = document.getElementById('save-indicator');
            indicator.classList.add('visible');
            setTimeout(() => indicator.classList.remove('visible'), 1500);
        }
    }
};

// 4. READER MODULE
const Reader = {
    open() {
        App.saveFromDOM();
        const s = Store.get().find(x => x.id === App.currentId);
        const container = document.getElementById('reading-container');
        const overlay = document.getElementById('reading-overlay');
        
        overlay.classList.add('active');

        let html = `<div class="reading-block type-title">${s.title}</div>`;
        html += `<div class="reading-block type-ref">${s.bibleRef}</div>`;
        
        s.blocks.forEach(b => {
            const styles = Utils.getStylesForColor(b.color);
            const text = b.content.replace(/\n/g, '<br>');
            const isBold = b.isBold ? 'font-weight:bold;' : '';
            const isItalic = b.isItalic ? 'font-style:italic;' : '';
            
            let blockStyle = `color:${styles.txt}; ${isBold} ${isItalic}`;

            if (b.type === 'topic') {
                 html += `<div class="reading-block" style="${blockStyle}; font-weight:700; display:flex; gap:12px;"><span style="color:${styles.txt}">•</span> <div>${text}</div></div>`;
                 return;
            }
            if (b.type === 'highlight') {
                blockStyle += `; background-color: ${styles.bg}; padding: 40px; border-radius:12px; text-align:center; font-weight:800; font-size: 36px;`;
            } else if (b.type === 'scripture') {
                blockStyle += `; border-left: 6px solid ${styles.txt}; background:${styles.bg}; padding: 30px; font-family:var(--font-serif); font-style:italic;`;
            } else if (b.type === 'note') {
                blockStyle += `; background-color: #FFFBEB; color: #92400E; padding: 20px; border: 1px solid #FDE68A; text-align: center; font-style: italic; width: 80%; margin: 30px auto; font-size: 20px;`;
            }

            html += `<div class="reading-block" style="${blockStyle}">${text}</div>`;
        });
        
        container.innerHTML = html;
    },
    close() {
        document.getElementById('reading-overlay').classList.remove('active');
    }
};

// 5. EXPORTER (PDF)
const Exporter = {
    generatePDF() {
        App.saveFromDOM();
        const s = Store.get().find(x => x.id === App.currentId);
        const colors = Utils.getStylesForColor;
        
        const element = document.createElement('div');
        element.style.padding = "40px";
        element.style.fontFamily = "Inter, sans-serif";
        
        let pdfHtml = `<div style="text-align:center; margin-bottom:30px;">
            <h1 style="font-size:24pt; margin:0; color:#111;">${s.title}</h1>
            <div style="font-size:14pt; font-weight:500; color:#666; margin-top:5px;">${s.bibleRef}</div>
        </div>`;
        
        s.blocks.forEach(b => {
            const styles = colors(b.color);
            const text = b.content.replace(/\n/g, '<br>');
            const isBold = b.isBold ? '700' : '400';
            const isItalic = b.isItalic ? 'italic' : 'normal';
            
            let blockStyle = `margin-bottom: 12px; font-size:12pt; line-height:1.5; font-weight:${isBold}; font-style:${isItalic}; color:${styles.txt};`;

            if (b.type === 'scripture') {
                blockStyle += `font-family:Lora, serif; padding:10px 15px; border-left:3px solid ${styles.txt}; background:${styles.bg}; font-style:italic;`;
            } else if (b.type === 'highlight') {
                blockStyle += `background:${styles.bg}; padding:15px; border-radius:8px; text-align:center; font-weight:800; font-size:14pt;`;
            } else if (b.type === 'topic') {
                 blockStyle += `display:flex; align-items:baseline; gap:8px; font-weight:700; font-size:12pt;`;
                 pdfHtml += `<div style="${blockStyle}"><span style="font-size:14pt; color:${styles.txt}">•</span> <div>${text}</div></div>`;
                 return;
            }

            pdfHtml += `<div style="${blockStyle}">${text}</div>`;
        });

        element.innerHTML = pdfHtml;

        const opt = {
            margin: 15,
            filename: `${s.title || 'esboco'}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        Utils.toast('Gerando PDF...');
        html2pdf().set(opt).from(element).save();
    }
};

window.startApp = App.init.bind(App);
startApp();
