<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PregaFlow Ultimate v2.1</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            /* TEMA CLARO */
            --bg-body: #F9FAFB;
            --bg-surface: #FFFFFF;
            --bg-toolbar: rgba(255, 255, 255, 0.95);
            --bg-block-highlight: #FEF3C7;
            --bg-block-scripture: #F3F4F6;
            
            --txt-primary: #1F2937;
            --txt-secondary: #6B7280;
            --txt-accent: #4F46E5;
            --border: #E5E7EB;
            
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --font-ui: 'Inter', sans-serif;
            --font-reading: 'Merriweather', serif;
        }

        /* TEMA ESCURO */
        body.dark {
            --bg-body: #111827;
            --bg-surface: #1F2937;
            --bg-toolbar: rgba(31, 41, 55, 0.95);
            --bg-block-highlight: #3D3418;
            --bg-block-scripture: #374151;
            
            --txt-primary: #F3F4F6;
            --txt-secondary: #9CA3AF;
            --txt-accent: #818CF8;
            --border: #374151;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            background: var(--bg-body); color: var(--txt-primary);
            font-family: var(--font-ui); margin: 0; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .btn { 
            background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px; 
            color: var(--txt-secondary); transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover { background: var(--border); color: var(--txt-primary); }
        .btn:active { transform: scale(0.95); }
        .btn.active { background: var(--txt-accent); color: white; }
        
        .btn-primary {
            background: var(--txt-primary); color: var(--bg-surface); padding: 12px;
            border-radius: var(--radius); width: 100%; font-weight: 600; display: flex; justify-content: center; gap: 8px;
        }

        /* HEADER */
        header {
            height: 60px; padding: 0 16px; background: var(--bg-surface);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }
        .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; color: var(--txt-primary); }
        .logo-box { width: 32px; height: 32px; background: var(--txt-accent); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        /* LISTA */
        #view-list { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .card {
            background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 16px; margin-bottom: 12px; cursor: pointer; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--txt-accent); }
        .card h3 { margin: 0 0 4px 0; font-size: 16px; color: var(--txt-primary); }
        .card p { margin: 0; color: var(--txt-secondary); font-size: 13px; }

        /* EDITOR */
        #view-editor { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-surface); }
        .editor-content { flex: 1; overflow-y: auto; padding: 30px 20px 100px 20px; max-width: 768px; margin: 0 auto; width: 100%; }

        .meta-area { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .input-title { font-size: 28px; font-weight: 800; width: 100%; border: none; margin-bottom: 10px; background: transparent; color: var(--txt-primary); }
        .input-ref { font-size: 16px; color: var(--txt-secondary); width: 100%; border: none; background: transparent; }
        
        /* BLOCOS */
        .block { position: relative; padding: 4px 0; margin-bottom: 8px; border-left: 3px solid transparent; padding-left: 12px; transition: border-color 0.2s; }
        .block.focused { border-color: var(--txt-accent); }
        .editable { min-height: 24px; outline: none; font-size: 17px; line-height: 1.6; color: var(--txt-primary); }
        .editable:empty:before { content: attr(placeholder); color: var(--txt-secondary); opacity: 0.5; pointer-events: none; display: block; }

        .block[data-type="h1"] .editable { font-size: 24px; font-weight: 700; }
        .block[data-type="h2"] .editable { font-size: 20px; font-weight: 600; color: var(--txt-primary); opacity: 0.9; }
        .block[data-type="scripture"] { background: var(--bg-block-scripture); border-radius: 8px; padding: 16px; border-left: 4px solid var(--txt-accent); }
        .block[data-type="scripture"] .editable { font-family: var(--font-reading); font-style: italic; }
        .block[data-type="highlight"] { background: var(--bg-block-highlight); padding: 20px; border-radius: 8px; text-align: center; }
        .block[data-type="highlight"] .editable { font-weight: 700; font-size: 18px; color: #B45309; }
        body.dark .block[data-type="highlight"] .editable { color: #FCD34D; }
        .align-center .editable { text-align: center; }
        .align-right .editable { text-align: right; }

        /* TOOLBAR */
        .toolbar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-toolbar); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); padding: 8px 12px;
            display: flex; gap: 6px; align-items: center;
            overflow-x: auto; z-index: 50;
        }
        .toolbar::-webkit-scrollbar { display: none; }
        .v-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
        
        /* CORES */
        .color-popover {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px; display: none; gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 60;
        }
        .color-popover.open { display: flex; animation: slideUp 0.2s; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; }

        /* BÍBLIA MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
            display: none; justify-content: center; align-items: flex-end; backdrop-filter: blur(2px);
        }
        .modal-overlay.open { display: flex; animation: fadeIn 0.2s; }
        .modal-card {
            background: var(--bg-surface); width: 100%; max-width: 600px; height: 85vh;
            border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.2); animation: slideUp 0.3s;
        }
        .bible-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
        .bible-select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--txt-primary); }
        .bible-content { flex: 1; overflow-y: auto; padding: 16px; }
        .verse-item { padding: 14px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
        .verse-actions { display: flex; gap: 8px; margin-left: auto; }
        .btn-small { font-size: 11px; padding: 6px 10px; background: var(--border); border-radius: 4px; color: var(--txt-primary); cursor: pointer; border: none; }
        .btn-small.accent { background: var(--txt-accent); color: white; }

        /* --- MODO PÚLPITO (DESIGN MODERNO) --- */
        #view-reading {
            position: fixed; inset: 0; background: #000; color: #fff;
            z-index: 200; padding: 80px 20px 40px 20px; overflow-y: auto;
            display: none; font-size: 28px; line-height: 1.6;
        }
        #view-reading.active { display: block; }
        
        .pulpit-controls {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; z-index: 210;
        }
        .timer-display { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: #fff; cursor: pointer; }
        .timer-display.paused { color: #FCD34D; }
        
        .reading-block { margin-bottom: 30px; max-width: 900px; margin-left: auto; margin-right: auto; }
        
        /* Versículo - Estilo Limpo */
        .reading-block[data-type="scripture"] { 
            color: #A7F3D0; 
            font-family: var(--font-reading); 
            font-style: italic; 
            border-left: 5px solid #059669; 
            padding-left: 24px; 
            margin: 40px auto;
        }
        
        /* DESTAQUE (HIGHLIGHT) - DESIGN ELEGANTE */
        .reading-block[data-type="highlight"] {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(0,0,0,0));
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-left: 6px solid #F59E0B;
            color: #FEF3C7;
            padding: 30px 40px;
            margin: 50px auto;
            border-radius: 4px 16px 16px 4px; /* Cantos arredondados assimétricos */
            text-align: center;
            font-size: 1.5em; /* Fonte aumentada */
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -0.02em;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.7);
        }

        .reading-h1 { 
            font-size: 1.5em; 
            font-weight: 800; 
            color: #60A5FA; 
            margin-bottom: 24px; 
            border-bottom: 2px solid #333; 
            padding-bottom: 8px;
            margin-top: 50px;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media(min-width: 768px) { .modal-overlay { align-items: center; } .modal-card { height: 70vh; border-radius: 20px; } }
    </style>
</head>
<body>

    <div id="view-list">
        <header style="position: sticky; top: 0; margin: -20px -20px 20px -20px; padding: 0 20px;">
            <div class="brand">
                <div class="logo-box"><i data-lucide="book-open" width="18"></i></div>
                PregaFlow
            </div>
            <button class="btn" onclick="App.toggleTheme()"><i data-lucide="moon"></i></button>
        </header>
        <button class="btn-primary" onclick="App.createSermon()">
            <i data-lucide="plus-circle" width="20"></i> Novo Esboço
        </button>
        <div id="sermon-list" style="margin-top: 20px;"></div>
    </div>

    <div id="view-editor" class="hidden">
        <header>
            <button class="btn" onclick="App.showList()"><i data-lucide="arrow-left"></i></button>
            <div class="flex gap-2">
                <button class="btn" onclick="App.toggleTheme()"><i data-lucide="moon"></i></button>
                <div class="v-sep"></div>
                <button class="btn" onclick="Pulpit.enter()" title="Modo Púlpito"><i data-lucide="monitor-play"></i></button>
                <button class="btn" onclick="Bible.open()" title="Bíblia"><i data-lucide="book"></i></button>
                <button class="btn" onclick="App.exportPDF()" title="PDF"><i data-lucide="download"></i></button>
            </div>
        </header>

        <div class="editor-content" id="editor-canvas">
            <div class="meta-area">
                <input type="text" id="meta-title" class="input-title" placeholder="Título da Mensagem" oninput="App.save()">
                <div class="flex items-center gap-2">
                    <input type="text" id="meta-ref" class="input-ref" placeholder="Texto base (ex: João 3:16)" oninput="App.save()">
                </div>
            </div>
            <div id="blocks-container"></div>
            <div style="height: 100px; display: flex; align-items: center; justify-content: center; opacity: 0.3; font-size: 12px; color: var(--txt-primary);">
                Fim do Esboço
            </div>
        </div>

        <div class="toolbar">
            <button class="btn" onclick="App.moveBlock(-1)" title="Subir"><i data-lucide="arrow-up"></i></button>
            <button class="btn" onclick="App.moveBlock(1)" title="Descer"><i data-lucide="arrow-down"></i></button>
            <div class="v-sep"></div>
            <button class="btn" onclick="App.addBlock('text')"><i data-lucide="plus"></i></button>
            <button class="btn" onclick="App.setBlockType('h1')">H1</button>
            <button class="btn" onclick="App.setBlockType('scripture')"><i data-lucide="quote"></i></button>
            <button class="btn" onclick="App.setBlockType('highlight')"><i data-lucide="highlighter"></i></button>
            <div class="v-sep"></div>
            <button class="btn" onmousedown="event.preventDefault(); App.format('bold')"><i data-lucide="bold"></i></button>
            <button class="btn" onmousedown="event.preventDefault(); App.format('italic')"><i data-lucide="italic"></i></button>
            <button class="btn" onmousedown="event.preventDefault(); App.toggleColors()"><i data-lucide="palette"></i></button>
            <div class="v-sep"></div>
            <button class="btn" onclick="App.deleteBlock()" style="color: #EF4444;"><i data-lucide="trash-2"></i></button>
        </div>

        <div id="color-popover" class="color-popover">
            <div class="color-dot" style="background:var(--txt-primary)" onclick="App.setColor('inherit')"></div>
            <div class="color-dot" style="background:#EF4444" onclick="App.setColor('#EF4444')"></div>
            <div class="color-dot" style="background:#3B82F6" onclick="App.setColor('#3B82F6')"></div>
            <div class="color-dot" style="background:#10B981" onclick="App.setColor('#10B981')"></div>
            <div class="color-dot" style="background:#F59E0B" onclick="App.setColor('#F59E0B')"></div>
        </div>
    </div>

    <div id="view-reading">
        <div class="pulpit-controls">
            <div class="flex items-center gap-2">
                <i data-lucide="clock" size="18" color="#ccc"></i>
                <div id="timer" class="timer-display" onclick="Pulpit.toggleTimer()">00:00</div>
                <button class="btn-small" onclick="Pulpit.resetTimer()">Zerar</button>
            </div>
            <button class="btn-small" style="background:#333; color:white; font-size:14px; padding:8px 16px;" onclick="Pulpit.exit()">Sair</button>
        </div>
        <div id="reading-content" style="margin-top: 20px;"></div>
    </div>

    <div id="bible-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="bible-header">
                <select id="bible-book" class="bible-select" onchange="Bible.loadChapters()"></select>
                <select id="bible-chapter" class="bible-select" style="max-width: 80px;" onchange="Bible.loadVerses()"></select>
                <button class="btn" onclick="Bible.close()"><i data-lucide="x"></i></button>
            </div>
            <div id="bible-results" class="bible-content">
                <div style="text-align: center; color: var(--txt-secondary); margin-top: 40px;">Selecione um livro e capítulo</div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const DB_KEY = 'pregaflow_v2_db';
        let currentSermonId = null;
        let focusedBlock = null;

        const Store = {
            getAll: () => JSON.parse(localStorage.getItem(DB_KEY) || '[]'),
            saveAll: (data) => localStorage.setItem(DB_KEY, JSON.stringify(data)),
            get: (id) => Store.getAll().find(x => x.id === id),
            update: (id, payload) => {
                const all = Store.getAll();
                const idx = all.findIndex(x => x.id === id);
                if (idx !== -1) {
                    all[idx] = { ...all[idx], ...payload, updatedAt: Date.now() };
                    Store.saveAll(all);
                }
            }
        };

        const App = {
            init: () => {
                App.renderList();
                if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
                new Sortable(document.getElementById('blocks-container'), { animation: 150, handle: '.block', onEnd: () => App.save() });
            },

            toggleTheme: () => {
                document.body.classList.toggle('dark');
                localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
            },

            renderList: () => {
                const list = Store.getAll();
                const container = document.getElementById('sermon-list');
                container.innerHTML = list.length ? list.map(s => `
                    <div class="card" onclick="App.openSermon('${s.id}')">
                        <h3>${s.title || 'Sem Título'}</h3>
                        <p>${s.bibleRef || 'Sem referência'} • ${new Date(s.updatedAt).toLocaleDateString()}</p>
                    </div>
                `).join('') : '<div style="text-align:center; padding:40px; color:var(--txt-secondary)">Nenhum esboço criado.</div>';
            },

            createSermon: () => {
                const id = 's_' + Date.now();
                const newSermon = { id, title: '', bibleRef: '', updatedAt: Date.now(), blocks: [{id: 'b_'+Date.now(), type: 'text', content: ''}] };
                const all = Store.getAll();
                all.unshift(newSermon);
                Store.saveAll(all);
                App.openSermon(id);
            },

            openSermon: (id) => {
                currentSermonId = id;
                const s = Store.get(id);
                document.getElementById('view-list').classList.add('hidden');
                document.getElementById('view-editor').classList.remove('hidden');
                document.getElementById('meta-title').value = s.title;
                document.getElementById('meta-ref').value = s.bibleRef;
                const container = document.getElementById('blocks-container');
                container.innerHTML = '';
                s.blocks.forEach(b => App.renderBlock(b));
            },

            renderBlock: (data, afterElement = null) => {
                const div = document
