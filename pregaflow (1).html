<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PregaFlow Studio Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        /* --- VARIÁVEIS E RESET --- */
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Lora', serif;
            --bg-body: #F3F4F6;
            --bg-paper: #FFFFFF;
            --bg-toolbar: rgba(255, 255, 255, 0.95);
            --txt-primary: #111827;
            --txt-secondary: #6B7280;
            --txt-tertiary: #9CA3AF;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --danger: #EF4444;
            --border: #E5E7EB;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-float: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --swatch-gray: #F3F4F6; --txt-gray: #374151;
            --swatch-blue: #EFF6FF; --txt-blue: #1D4ED8;
            --swatch-green: #ECFDF5; --txt-green: #047857;
            --swatch-red: #FEF2F2; --txt-red: #B91C1C;
            --swatch-amber: #FFFBEB; --txt-amber: #B45309;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-body);
            color: var(--txt-primary);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            height: 100dvh;
            overflow: hidden;
        }
    </style>
</head>
