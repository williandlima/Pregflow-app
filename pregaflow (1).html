<script>
document.addEventListener("DOMContentLoaded", () => {

    // --- FAILSAFE PARA SPLASH ---
    const splash = document.getElementById("splash");
    if (splash) {
        setTimeout(() => {
            splash.style.opacity = "0";
            setTimeout(() => splash.remove(), 600);
        }, 600);
    }

    // --- CORRIGE ICONES SVG NO ANDROID ---
    document.querySelectorAll("use").forEach(u => {
        const href = u.getAttribute("href") || u.getAttribute("xlink:href");
        if (href && href.startsWith("#")) {
            u.setAttribute("href", href);
        }
    });

    // --- FORÇA CLICK NO ANDROID ---
    document.querySelectorAll("button, .btn, .icon-btn, .tool-chip, .sermon-card")
        .forEach(el => {
            el.style.touchAction = "manipulation";
            el.addEventListener("touchstart", () => {}, {passive: true});
        });

    // --- REMOVE BACKDROP-FILTER NO ANDROID (QUE CAUSA TRAVAMENTO) ---
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (isAndroid) {
        document.querySelectorAll(".toolbar-sticky, .modal-overlay, .hud-float")
            .forEach(el => el.style.backdropFilter = "none");
        document.querySelectorAll(".toolbar-sticky, .modal-overlay, .hud-float")
            .forEach(el => el.style.webkitBackdropFilter = "none");
    }

});
</script>
