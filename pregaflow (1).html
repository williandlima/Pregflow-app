<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PregaFlow - Apple Style</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            /* --- PALETA APPLE --- */
            --bg-body: #F5F5F7;          /* Fundo cinza claro clássico Apple */
            --bg-sidebar: #FFFFFF;       /* Sidebar branca */
            --bg-paper: #FFFFFF;         /* Papel branco */
            --bg-glass: rgba(255, 255, 255, 0.85); /* Efeito Vidro */
            
            --text-primary: #1D1D1F;     /* Preto suave */
            --text-secondary: #86868B;   /* Cinza texto */
            --separator: #D1D1D6;        /* Linhas divisórias */
            
            --accent: #007AFF;           /* Apple Blue */
            --accent-hover: #0062CC;
            --danger: #FF3B30;           /* Apple Red */
            --success: #34C759;          /* Apple Green */
            
            /* --- DIMENSÕES E SOMBRAS --- */
            --sidebar-width: 280px;
            --radius: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
            
            /* --- FONTES --- */
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-serif: 'Lora', serif;
        }

        * { box-sizing: border-box; outline: none; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-body);
            font-family: var(--font-sans);
            color: var(--text-primary);
            overflow: hidden; /* Impede scroll na janela inteira */
        }

        /* --- LAYOUT MASTER-DETAIL --- */
        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }

        /* --- SIDEBAR (ESQUERDA) --- */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--separator);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            padding-top: 30px; /* Estilo Mac Traffic Lights spacing */
            border-bottom: 1px solid var(--separator);
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px;
        }

        .btn-new {
            width: 100%;
            padding: 8px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-new:hover { background: var(--accent-hover); }

        #list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* Item da Lista */
        .list-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .list-item:hover { background: #F2F2F7; }
        .list-item.active { background: #E4E9F2; color: var(--accent); }
        
        .item-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-date { font-size: 11px; color: var(--text-secondary); }
        
        .btn-del-item {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            border: none; background: transparent; color: var(--text-secondary);
            cursor: pointer; opacity: 0; transition: 0.2s; font-size: 16px;
        }
        .list-item:hover .btn-del-item { opacity: 1; }
        .btn-del-item:hover { color: var(--danger); }


        /* --- MAIN CONTENT (DIREITA) --- */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-body);
        }

        /* --- TOOLBAR (GLASSMORPHISM) --- */
        #toolbar {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 6px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            
            /* O Segredo do estilo Apple: Backdrop Filter */
            background: var(--bg-glass);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tool-group {
            display: flex; align-items: center; gap: 4px;
            padding-right: 12px; margin-right: 12px;
            border-right: 1px solid var(--separator);
        }
        .tool-group:last-child { border-right: none; }

        .btn-tool {
            width: 32px; height: 32px;
            border: none; background: transparent;
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            font-size: 14px;
        }
        .btn-tool:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
        .btn-tool.active { background: rgba(0,122,255,0.1); color: var(--accent); }
        
        .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }

        .color-dot {
            width: 16px; height: 16px; border-radius: 50%; 
            cursor: pointer; margin: 0 3px; 
            border: 2px solid transparent; transition: transform 0.2s;
        }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.active { box-shadow: 0 0 0 2px var(--bg-body), 0 0 0 4px var(--text-primary); }

        /* --- ÁREA DE ROLAGEM DO EDITOR --- */
        #editor-scroller {
            flex: 1;
            overflow-y: auto; /* Habilita a barra de rolagem */
            padding: 40px;
            scroll-behavior: smooth;
            /* Garante que o conteúdo flua */
            display: flex;
            justify-content: center;
        }

        /* --- O PAPEL (A4) --- */
        #paper {
            background: var(--bg-paper);
            width: 100%;
            max-width: 820px; /* Largura ideal de leitura */
            min-height: 1000px;
            padding: 70px 80px;
            border-radius: 2px;
            box-shadow: var(--shadow-lg);
            position: relative;
            /* Espaço extra no final para conforto */
            margin-bottom: 100px; 
        }

        /* --- SCROLLBAR ESTILO MAC --- */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.15);
            border-radius: 10px;
            border: 3px solid var(--bg-body); /* Cria margem interna */
        }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(0,0,0,0.3); }

        /* --- CONTEÚDO EDITÁVEL --- */
        input, textarea {
            font-family: inherit; border: none; background: transparent;
            width: 100%; resize: none; padding: 0; margin: 0;
        }
        
        #doc-title {
            font-size: 32px; font-weight: 800; margin-bottom: 10px;
            color: var(--text-primary); letter-spacing: -0.5px;
        }
        #doc-ref {
            font-size: 17px; color: var(--text-secondary); 
            border-bottom: 1px solid #E5E5E5; padding-bottom: 20px; margin-bottom: 30px;
        }

        /* Blocos */
        .block-wrap {
            position: relative;
            display: flex; gap: 12px;
            padding: 2px 0;
            border-radius: 4px;
            border: 1px solid transparent;
        }
        .block-wrap:hover { background-color: #F9F9FA; }
        .block-wrap.focused { background-color: #F0F0F5; }

        .drag-handle {
            width: 20px; margin-top: 6px; cursor: grab; 
            color: #D1D1D6; opacity: 0; transition: 0.2s;
        }
        .block-wrap:hover .drag-handle { opacity: 1; }

        textarea.block-text {
            font-size: 16px; line-height: 1.6; overflow: hidden;
            color: var(--text-primary);
        }

        /* Estilos de Texto */
        [data-fmt*="bold"] textarea { font-weight: 700; }
        [data-fmt*="italic"] textarea { font-style: italic; }

        /* Cores */
        [data-color="blue"] textarea { color: #007AFF; }
        [data-color="red"] textarea { color: #FF3B30; }
        [data-color="green"] textarea { color: #34C759; }
        [data-color="amber"] textarea { color: #FF9500; }

        /* Tipos Especiais */
        [data-type="topic"] textarea { font-size: 19px; font-weight: 600; letter-spacing: -0.3px; }
        [data-type="topic"] .drag-handle { margin-top: 8px; }
        
        [data-type="scripture"] textarea {
            font-family: var(--font-serif); font-style: italic; font-size: 18px;
            color: #4A4A4F; padding-left: 16px; border-left: 3px solid #D1D1D6;
        }

        [data-type="highlight"] textarea {
            background: #F2F2F7; border-radius: 12px; padding: 24px;
            text-align: center; font-weight: 800; font-size: 24px; color: var(--text-primary);
        }

        [data-type="note"] textarea {
            background: #FFF9E6; color: #8A6D3B; padding: 12px;
            border-radius: 8px; font-size: 14px; border: 1px solid #FFEBAA;
        }

        /* Botão Adicionar (Flutuante no fim do papel) */
        .btn-add-block {
            width: 100%; padding: 16px; margin-top: 20px;
            border: 2px dashed #E5E5EA; border-radius: 8px;
            color: #AEAEB2; font-weight: 600; background: transparent;
            cursor: pointer; transition: 0.2s;
        }
        .btn-add-block:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,122,255,0.02); }

        /* Overlay Leitura */
        #reader-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            z-index: 500; display: none; align-items: center; justify-content: center;
        }
        #reader-overlay.active { display: flex; }
        
        .reader-card {
            background: white; width: 90%; height: 90%; max-width: 1000px;
            border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .reader-header {
            padding: 20px; border-bottom: 1px solid var(--separator);
            display: flex; justify-content: space-between; align-items: center;
        }
        .reader-content { flex: 1; overflow-y: auto; padding: 60px 80px; font-size: 22px; }
        
        /* Toast Notification */
        .toast {
            position: fixed; bottom: 30px; right: 30px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 10px 20px; border-radius: 30px; font-weight: 500; font-size: 13px;
            backdrop-filter: blur(10px); opacity: 0; transition: 0.3s; pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary);
        }

    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                PregaFlow
            </div>
            <button class="btn-new" onclick="App.create()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Novo Esboço
            </button>
        </div>
        <div id="list-container"></div>
    </div>

    <div id="main">
        <div id="toolbar">
            <div class="tool-group">
                <button class="btn-tool" onclick="App.setType('text')" title="Texto Normal">Aa</button>
                <button class="btn-tool" onclick="App.setType('topic')" title="Tópico Principal">H1</button>
                <button class="btn-tool" onclick="App.setType('scripture')" title="Versículo">“</button>
            </div>
            
            <div class="tool-group">
                <button class="btn-tool" onclick="App.setType('highlight')" title="Destaque">★</button>
                <button class="btn-tool" onclick="App.setType('note')" title="Nota de Rodapé">✎</button>
            </div>

            <div class="tool-group">
                <button class="btn-tool" onclick="App.setFmt('bold')"><b>B</b></button>
                <button class="btn-tool" onclick="App.setFmt('italic')"><i>I</i></button>
            </div>

            <div class="tool-group" style="padding-left: 5px;">
                <div class="color-dot" style="background:#1D1D1F; border:1px solid #ccc" onclick="App.setColor('default')"></div>
                <div class="color-dot" style="background:#007AFF" onclick="App.setColor('blue')"></div>
                <div class="color-dot" style="background:#34C759" onclick="App.setColor('green')"></div>
                <div class="color-dot" style="background:#FF3B30" onclick="App.setColor('red')"></div>
                <div class="color-dot" style="background:#FF9500" onclick="App.setColor('amber')"></div>
            </div>

            <div style="flex:1"></div>

            <div class="tool-group" style="border:none">
                <button class="btn-tool" onclick="Reader.open()" title="Modo Leitura" style="color:var(--accent)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 1-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                </button>
                <button class="btn-tool" onclick="Exporter.pdf()" title="Exportar PDF">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg>
                </button>
                <button class="btn-tool" onclick="App.delBlock()" style="color:var(--danger)" title="Excluir Bloco">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>

        <div id="editor-scroller">
            <div id="paper" class="hidden">
                <textarea id="doc-title" rows="1" placeholder="Título da Mensagem" oninput="App.input(this)"></textarea>
                <textarea id="doc-ref" rows="1" placeholder="Texto Base / Referência" oninput="App.input(this)"></textarea>
                
                <div id="blocks"></div>
                
                <button class="btn-add-block" onclick="App.add()">+ Adicionar Bloco de Texto</button>
            </div>
            
            <div id="empty-splash" class="empty-state">
                <div style="font-size: 40px; margin-bottom: 20px;"></div>
                <h3>Nenhum esboço selecionado</h3>
                <p>Selecione um item na barra lateral ou crie um novo.</p>
            </div>
        </div>
    </div>
</div>

<div id="reader-overlay">
    <div class="reader-card">
        <div class="reader-header">
            <h3 style="margin:0">Modo Púlpito</h3>
            <button onclick="Reader.close()" style="background:#F2F2F7; border:none; padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:600">Fechar</button>
        </div>
        <div class="reader-content" id="reader-text"></div>
    </div>
</div>

<div id="toast" class="toast">Alterações Salvas</div>

<script>
/* --- ENGINE --- */
const ID = () => Math.random().toString(36).substr(2, 9);
const DB = {
    get: () => JSON.parse(localStorage.getItem('pf_apple_db') || '[]'),
    set: (d) => localStorage.setItem('pf_apple_db', JSON.stringify(d))
};

const App = {
    curr: null, focus: null,

    init() {
        this.renderList();
        
        // Configurar Drag & Drop
        new Sortable(document.getElementById('blocks'), {
            handle: '.drag-handle',
            animation: 150,
            ghostClass: 'bg-blue-50',
            onEnd: () => this.save()
        });

        // Abrir último se existir
        const list = DB.get();
        if(list.length) this.open(list[0].id);
    },

    renderList() {
        const list = DB.get();
        const container = document.getElementById('list-container');
        container.innerHTML = list.map(s => `
            <div class="list-item ${this.curr === s.id ? 'active' : ''}" onclick="App.open('${s.id}')">
                <div class="item-title">${s.title || 'Sem Título'}</div>
                <div class="item-date">${new Date(s.created).toLocaleDateString('pt-BR')}</div>
                <button class="btn-del-item" onclick="App.delSermon(event, '${s.id}')">×</button>
            </div>
        `).join('');
    },

    create() {
        const s = {
            id: ID(), title: '', ref: '', created: Date.now(),
            blocks: [{ id: ID(), type: 'text', content: '' }]
        };
        const list = DB.get();
        list.unshift(s);
        DB.set(list);
        this.renderList();
        this.open(s.id);
    },

    delSermon(e, id) {
        e.stopPropagation();
        if(!confirm('Tem certeza que deseja apagar este esboço?')) return;
        const list = DB.get().filter(x => x.id !== id);
        DB.set(list);
        if(this.curr === id) {
            this.curr = null;
            document.getElementById('paper').classList.add('hidden');
            document.getElementById('empty-splash').classList.remove('hidden');
        }
        this.renderList();
    },

    open(id) {
        if(this.curr) this.save(); // Salva o anterior
        this.curr = id;
        const s = DB.get().find(x => x.id === id);
        if(!s) return;

        // UI Updates
        document.getElementById('paper').classList.remove('hidden');
        document.getElementById('empty-splash').classList.add('hidden');
        
        document.getElementById('doc-title').value = s.title;
        document.getElementById('doc-ref').value = s.ref;
        this.resize(document.getElementById('doc-title'));
        this.resize(document.getElementById('doc-ref'));

        const container = document.getElementById('blocks');
        container.innerHTML = '';
        s.blocks.forEach(b => container.appendChild(this.buildBlock(b)));

        this.renderList(); // Atualiza highlight
    },

    buildBlock(data) {
        const div = document.createElement('div');
        div.className = 'block-wrap';
        div.id = 'b-' + data.id;
        div.dataset.id = data.id;
        
        // Aplicar Atributos
        if(data.type) div.dataset.type = data.type;
        if(data.color) div.dataset.color = data.color;
        let fmt = [];
        if(data.bold) fmt.push('bold');
        if(data.italic) fmt.push('italic');
        div.dataset.fmt = fmt.join(' ');

        div.innerHTML = `
            <div class="drag-handle">
                <svg width="16" height="16" viewBox="0 0 24 24" stroke="#C7C7CC" stroke-width="2"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
            </div>
            <textarea class="block-text" rows="1" 
                placeholder="Digite aqui..." 
                onfocus="App.focusBlock('${data.id}')" 
                oninput="App.input(this)">${data.content || ''}</textarea>
        `;
        
        setTimeout(() => this.resize(div.querySelector('textarea')), 0);
        return div;
    },

    add() {
        const b = { id: ID(), type: 'text', content: '' };
        const el = this.buildBlock(b);
        document.getElementById('blocks').appendChild(el);
        const ta = el.querySelector('textarea');
        ta.focus();
        
        // Scroll suave até o novo bloco
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        this.save();
    },

    save() {
        if(!this.curr) return;
        
        const title = document.getElementById('doc-title').value;
        const ref = document.getElementById('doc-ref').value;
        
        const blocks = [];
        document.querySelectorAll('.block-wrap').forEach(el => {
            const fmt = el.dataset.fmt || '';
            blocks.push({
                id: el.dataset.id,
                type: el.dataset.type || 'text',
                color: el.dataset.color || 'default',
                bold: fmt.includes('bold'),
                italic: fmt.includes('italic'),
                content: el.querySelector('textarea').value
            });
        });

        const list = DB.get();
        const idx = list.findIndex(x => x.id === this.curr);
        if(idx !== -1) {
            list[idx] = { ...list[idx], title, ref, blocks };
            DB.set(list);
            
            // Atualizar título na sidebar se mudou
            const sidebarTitle = document.querySelector(`.list-item.active .item-title`);
            if(sidebarTitle && title) sidebarTitle.innerText = title;
            
            this.showToast();
        }
    },

    // --- FERRAMENTAS ---
    focusBlock(id) {
        this.focus = id;
        document.querySelectorAll('.block-wrap').forEach(e => e.classList.remove('focused'));
        const el = document.getElementById('b-' + id);
        if(el) {
            el.classList.add('focused');
            this.updateToolbar(el);
        }
    },

    updateToolbar(el) {
        // Resetar botões (lógica visual simplificada)
        document.querySelectorAll('.btn-tool, .color-dot').forEach(b => b.classList.remove('active'));
        
        const type = el.dataset.type || 'text';
        document.querySelector(`button[onclick*="'${type}'"]`)?.classList.add('active');
        
        const fmt = el.dataset.fmt || '';
        if(fmt.includes('bold')) document.querySelector(`button[onclick*="'bold'"]`)?.classList.add('active');
        if(fmt.includes('italic')) document.querySelector(`button[onclick*="'italic'"]`)?.classList.add('active');
        
        const color = el.dataset.color || 'default';
        document.querySelector(`.color-dot[onclick*="'${color}'"]`)?.classList.add('active');
    },

    modify(fn) {
        if(!this.focus) return;
        const el = document.getElementById('b-' + this.focus);
        if(el) {
            fn(el);
            this.save();
            this.updateToolbar(el);
        }
    },

    setType(t) { this.modify(e => e.dataset.type = t); },
    setColor(c) { this.modify(e => e.dataset.color = c); },
    setFmt(f) { 
        this.modify(e => {
            let curr = e.dataset.fmt || '';
            e.dataset.fmt = curr.includes(f) ? curr.replace(f, '').trim() : (curr + ' ' + f).trim();
        }); 
    },
    delBlock() {
        if(this.focus) {
            document.getElementById('b-' + this.focus).remove();
            this.save();
        }
    },

    // --- UTIL ---
    input(el) {
        this.resize(el);
        this.debouncedSave();
    },
    resize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    },
    debouncedSave: function() {
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.save(), 1000);
    },
    showToast() {
        const t = document.getElementById('toast');
        t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2000);
    }
};

const Reader = {
    open() {
        App.save();
        const s = DB.get().find(x => x.id === App.curr);
        if(!s) return;

        let html = `<h1 style="font-size:48px; margin-bottom:10px; letter-spacing:-1px">${s.title}</h1>
                    <p style="color:#86868B; font-size:24px; margin-bottom:60px; border-bottom:1px solid #E5E5E5; padding-bottom:20px">${s.ref}</p>`;
        
        s.blocks.forEach(b => {
            let st = `margin-bottom:24px; line-height:1.5; color:${this.getColor(b.color)};`;
            if(b.bold) st += 'font-weight:bold;';
            if(b.italic) st += 'font-style:italic;';
            
            const txt = (b.content || '').replace(/\n/g, '<br>');

            if(b.type === 'topic') html += `<h2 style="${st} font-size:32px; letter-spacing:-0.5px; margin-top:40px;">${txt}</h2>`;
            else if(b.type === 'highlight') html += `<div style="${st} background:#F2F2F7; padding:40px; border-radius:16px; text-align:center; font-size:32px; font-weight:800; color:#1D1D1F">${txt}</div>`;
            else if(b.type === 'scripture') html += `<div style="${st} border-left:4px solid #D1D1D6; padding:10px 30px; font-family:'Lora',serif; font-size:26px; color:#4A4A4F;">${txt}</div>`;
            else if(b.type === 'note') html += `<div style="${st} background:#FFF9E6; color:#8A6D3B; padding:20px; border-radius:12px; text-align:center; font-size:20px;">${txt}</div>`;
            else html += `<p style="${st}">${txt}</p>`;
        });

        document.getElementById('reader-text').innerHTML = html;
        document.getElementById('reader-overlay').classList.add('active');
    },
    
    close() { document.getElementById('reader-overlay').classList.remove('active'); },
    
    getColor(c) {
        return { blue:'#007AFF', red:'#FF3B30', green:'#34C759', amber:'#FF9500' }[c] || '#1D1D1F';
    }
};

const Exporter = {
    pdf() {
        Reader.open();
        const el = document.getElementById('reader-text');
        const opt = {
            margin: 20,
            filename: 'sermao.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(el).save();
    }
};

// Iniciar
App.init();
</script>
</body>
</html>
