<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PregaFlow Desktop Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            /* -- MODO CLARO (PADRÃO) -- */
            --bg-body: #F3F4F6;
            --bg-sidebar: #FFFFFF;
            --bg-paper: #FFFFFF;
            --txt-main: #111827;
            --txt-muted: #6B7280;
            --border: #E5E7EB;
            --accent: #2563EB;
            --accent-bg: #EFF6FF;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            
            /* Scrollbar Claro */
            --scroll-track: #E5E7EB;
            --scroll-thumb: #9CA3AF;
            
            /* Cores de Destaque (Texto) */
            --c-gray: #374151; --c-blue: #1D4ED8; --c-green: #047857; 
            --c-red: #B91C1C; --c-amber: #B45309;
            /* Cores de Destaque (Fundo) */
            --bg-gray: #F3F4F6; --bg-blue: #EFF6FF; --bg-green: #ECFDF5; 
            --bg-red: #FEF2F2; --bg-amber: #FFFBEB;
        }

        body.dark {
            /* -- MODO ESCURO -- */
            --bg-body: #0F172A;
            --bg-sidebar: #1E293B;
            --bg-paper: #1E293B;
            --txt-main: #F9FAFB;
            --txt-muted: #9CA3AF;
            --border: #334155;
            --accent: #60A5FA;
            --accent-bg: #1E293B;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);

            /* Scrollbar Escuro */
            --scroll-track: #0F172A;
            --scroll-thumb: #475569;

            /* Cores Adaptadas para Fundo Escuro */
            --c-gray: #E5E7EB; --c-blue: #93C5FD; --c-green: #6EE7B7; 
            --c-red: #FCA5A5; --c-amber: #FCD34D;
            --bg-gray: #334155; --bg-blue: #172554; --bg-green: #064E3B; 
            --bg-red: #7F1D1D; --bg-amber: #451A03;
        }

        /* --- RESET & SCROLLBAR --- */
        * { box-sizing: border-box; outline: none; }
        body { margin: 0; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; background: var(--bg-body); color: var(--txt-main); transition: background 0.3s, color 0.3s; }
        
        /* Barra de Rolagem Personalizada e Visível */
        ::-webkit-scrollbar { width: 14px; height: 14px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); border-left: 1px solid var(--border); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 3px solid var(--scroll-track); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* --- LAYOUT --- */
        #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
        .hidden { display: none !important; }
        .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; color: var(--txt-muted); transition: 0.2s; }
        button:hover { color: var(--txt-main); }

        /* --- SIDEBAR --- */
        #sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .brand { padding: 20px; font-weight: 800; font-size: 18px; color: var(--txt-main); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .btn-new { margin: 15px; padding: 12px; background: var(--accent); color: white; border-radius: 6px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-new:hover { opacity: 0.9; color: white; }
        
        #list { flex: 1; overflow-y: auto; padding: 10px; }
        .card { padding: 12px; margin-bottom: 5px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; position: relative; }
        .card:hover { background: var(--bg-body); }
        .card.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
        .card-title { font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-ref { font-size: 12px; opacity: 0.7; }
        .btn-del { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); opacity: 0; color: var(--c-red); }
        .card:hover .btn-del { opacity: 1; }

        /* --- EDITOR --- */
        #editor-wrap { display: flex; flex-direction: column; height: 100%; position: relative; visibility: hidden; }
        
        /* Toolbar */
        .toolbar { height: 60px; padding: 0 30px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .t-btn { width: 36px; height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .t-btn:hover { background: var(--bg-body); }
        .t-btn.active { background: var(--bg-body); color: var(--accent); border: 1px solid var(--border); }
        .sep { width: 1px; height: 24px; background: var(--border); margin: 0 5px; }
        
        .dot { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
        .dot:hover { transform: scale(1.1); }
        .dot.active { border-color: var(--txt-main); }

        /* Papel */
        .stage { flex: 1; overflow-y: auto; padding: 40px; background: var(--bg-body); display: flex; justify-content: center; }
        .paper { width: 100%; max-width: 850px; background: var(--bg-paper); padding: 60px; min-height: 100%; box-shadow: var(--shadow); transition: background 0.3s; }

        /* Inputs */
        input, textarea { width: 100%; border: none; background: transparent; font-family: inherit; color: var(--txt-main); resize: none; }
        .inp-title { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
        .inp-ref { font-size: 18px; color: var(--txt-muted); margin-bottom: 40px; border-bottom: 2px solid var(--border); padding-bottom: 20px; }

        /* Blocos */
        .block { display: flex; gap: 10px; padding: 5px 0; border-left: 3px solid transparent; align-items: flex-start; }
        .block:hover { background: rgba(0,0,0,0.02); }
        .block.focused { background: rgba(0,0,0,0.03); border-color: var(--border); }
        .handle { cursor: grab; opacity: 0; margin-top: 5px; }
        .block:hover .handle { opacity: 0.5; }

        /* Estilos de Bloco */
        .block textarea { line-height: 1.6; font-size: 16px; overflow: hidden; }
        .block[data-format*="bold"] textarea { font-weight: 700; }
        .block[data-format*="italic"] textarea { font-style: italic; }
        
        .block[data-color="gray"] { color: var(--c-gray); }
        .block[data-color="blue"] { color: var(--c-blue); }
        .block[data-color="green"] { color: var(--c-green); }
        .block[data-color="red"] { color: var(--c-red); }
        .block[data-color="amber"] { color: var(--c-amber); }

        /* Tipos Específicos */
        .block[data-type="topic"] textarea { font-size: 20px; font-weight: 700; }
        .block[data-type="topic"]::before { content: '•'; font-size: 24px; color: currentColor; margin-top: -5px; }
        
        .block[data-type="scripture"] textarea { font-family: 'Lora', serif; font-style: italic; padding: 15px; background: var(--bg-body); border-left: 3px solid currentColor; }
        
        .block[data-type="highlight"] textarea { font-size: 24px; font-weight: 800; text-align: center; padding: 30px; background: var(--bg-gray); color: var(--c-gray); border-radius: 8px; }
        
        .block[data-type="note"] textarea { background: var(--bg-amber); color: var(--c-amber); padding: 15px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }

        /* --- LEITURA --- */
        #reader { position: fixed; inset: 0; background: var(--bg-body); z-index: 999; overflow-y: auto; padding: 50px; display: none; }
        #reader.active { display: block; }
        .read-content { max-width: 900px; margin: 0 auto; padding-bottom: 100px; }
        .r-block { margin-bottom: 24px; font-size: 26px; line-height: 1.6; color: var(--txt-main); }

    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <div class="brand">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            PregaFlow
        </div>
        <button class="btn-new" onclick="App.addSermon()">+ Novo Esboço</button>
        <div id="list"></div>
    </div>

    <div id="editor-wrap">
        <div class="toolbar">
            <button class="t-btn" onclick="App.setType('text')" title="Texto">T</button>
            <button class="t-btn" onclick="App.setType('topic')" title="Tópico">H1</button>
            <button class="t-btn" onclick="App.setType('scripture')" title="Versículo">""</button>
            <button class="t-btn" onclick="App.setType('highlight')" title="Destaque">★</button>
            <button class="t-btn" onclick="App.setType('note')" title="Nota">✎</button>
            
            <div class="sep"></div>
            
            <button class="t-btn" onclick="App.toggleFormat('bold')" title="Negrito"><b>B</b></button>
            <button class="t-btn" onclick="App.toggleFormat('italic')" title="Itálico"><i>I</i></button>
            
            <div class="sep"></div>
            
            <div class="dot" style="background:var(--c-gray)" onclick="App.setColor('gray')"></div>
            <div class="dot" style="background:var(--c-blue)" onclick="App.setColor('blue')"></div>
            <div class="dot" style="background:var(--c-green)" onclick="App.setColor('green')"></div>
            <div class="dot" style="background:var(--c-red)" onclick="App.setColor('red')"></div>
            <div class="dot" style="background:var(--c-amber)" onclick="App.setColor('amber')"></div>

            <div class="sep"></div>

            <button class="t-btn" onclick="App.move('up')">↑</button>
            <button class="t-btn" onclick="App.move('down')">↓</button>
            <button class="t-btn" onclick="App.delBlock()" style="color:var(--c-red)">✕</button>

            <div style="flex:1"></div>

            <button class="t-btn" onclick="Theme.toggle()" title="Modo Noturno">◐</button>
            <button class="t-btn" onclick="App.modeRead()" title="Púlpito">👁</button>
            <button class="t-btn" onclick="App.exportPDF()" title="PDF" style="color:var(--accent)">PDF</button>
        </div>

        <div class="stage">
            <div class="paper">
                <input id="in-title" class="inp-title" placeholder="Título da Mensagem" oninput="App.save()">
                <input id="in-ref" class="inp-ref" placeholder="Referência Bíblica / Data" oninput="App.save()">
                <div id="blocks"></div>
                <button style="width:100%; padding:15px; border:1px dashed var(--border); margin-top:20px;" onclick="App.addBlock()">+ Adicionar Texto</button>
            </div>
        </div>
    </div>
</div>

<div id="reader">
    <button style="position:fixed; top:20px; right:20px; padding:10px 20px; background:var(--txt-main); color:var(--bg-body); border-radius:20px; font-weight:bold;" onclick="document.getElementById('reader').classList.remove('active')">Sair</button>
    <div id="read-content" class="read-content"></div>
</div>

<script>
const Utils = {
    id: () => Math.random().toString(36).substr(2, 9),
    colors: {
        gray: {t:'var(--c-gray)', b:'var(--bg-gray)'},
        blue: {t:'var(--c-blue)', b:'var(--bg-blue)'},
        green: {t:'var(--c-green)', b:'var(--bg-green)'},
        red: {t:'var(--c-red)', b:'var(--bg-red)'},
        amber: {t:'var(--c-amber)', b:'var(--bg-amber)'}
    }
};

const Theme = {
    toggle() {
        document.body.classList.toggle('dark');
        localStorage.setItem('pregaflow_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    },
    load() {
        if(localStorage.getItem('pregaflow_theme') === 'dark') document.body.classList.add('dark');
    }
};

const Store = {
    data: [],
    load() { this.data = JSON.parse(localStorage.getItem('pregaflow_db') || '[]'); },
    save() { localStorage.setItem('pregaflow_db', JSON.stringify(this.data)); }
};

const App = {
    curr: null,
    focusId: null,

    init() {
        Theme.load();
        Store.load();
        this.renderList();
        
        new Sortable(document.getElementById('blocks'), { 
            handle: '.handle', animation: 150, onEnd: () => this.saveDOM() 
        });

        if (Store.data.length > 0) this.open(Store.data[0].id);
    },

    addSermon() {
        const s = { id: Utils.id(), title: 'Novo Esboço', ref: '', blocks: [] };
        Store.data.unshift(s);
        Store.save();
        this.renderList();
        this.open(s.id);
    },

    delSermon(e, id) {
        e.stopPropagation();
        if(!confirm('Apagar?')) return;
        Store.data = Store.data.filter(x => x.id !== id);
        Store.save();
        this.renderList();
        if(this.curr === id) document.getElementById('editor-wrap').style.visibility = 'hidden';
    },

    renderList() {
        const el = document.getElementById('list');
        el.innerHTML = Store.data.map(s => `
            <div class="card ${this.curr === s.id ? 'active' : ''}" onclick="App.open('${s.id}')">
                <div class="card-title">${s.title || 'Sem Título'}</div>
                <div class="card-ref">${s.ref || '...'}</div>
                <button class="btn-del" onclick="App.delSermon(event, '${s.id}')">🗑</button>
            </div>
        `).join('');
    },

    open(id) {
        if(this.curr) this.saveDOM();
        this.curr = id;
        const s = Store.data.find(x => x.id === id);
        if(!s) return;

        document.getElementById('editor-wrap').style.visibility = 'visible';
        document.getElementById('in-title').value = s.title;
        document.getElementById('in-ref').value = s.ref;
        
        const box = document.getElementById('blocks');
        box.innerHTML = '';
        s.blocks.forEach(b => box.appendChild(this.createBlock(b)));
        
        this.renderList();
        this.resizeAll();
    },

    createBlock(b) {
        const div = document.createElement('div');
        div.className = 'block';
        div.id = 'b-' + b.id;
        div.dataset.id = b.id;
        this.applyMeta(div, b);
        
        div.innerHTML = `
            <div class="handle">⠿</div>
            <textarea rows="1" oninput="App.resize(this); App.saveDOM()" onfocus="App.setFocus('${b.id}')">${b.content}</textarea>
        `;
        return div;
    },

    applyMeta(el, data) {
        el.dataset.type = data.type;
        el.dataset.color = data.color;
        el.dataset.format = (data.bold ? 'bold ' : '') + (data.italic ? 'italic' : '');
    },

    addBlock() {
        const b = { id: Utils.id(), type: 'text', content: '', color: 'gray' };
        const el = this.createBlock(b);
        document.getElementById('blocks').appendChild(el);
        el.querySelector('textarea').focus();
        this.saveDOM();
    },

    saveDOM() {
        if(!this.curr) return;
        const title = document.getElementById('in-title').value;
        const ref = document.getElementById('in-ref').value;
        const blocks = [];
        
        document.querySelectorAll('.block').forEach(el => {
            blocks.push({
                id: el.dataset.id,
                type: el.dataset.type,
                color: el.dataset.color,
                bold: el.dataset.format.includes('bold'),
                italic: el.dataset.format.includes('italic'),
                content: el.querySelector('textarea').value
            });
        });

        const idx = Store.data.findIndex(x => x.id === this.curr);
        if(idx !== -1) {
            Store.data[idx] = { id: this.curr, title, ref, blocks };
            Store.save();
            // Atualiza título na lista sem re-renderizar tudo
            const cardTitle = document.querySelector(`.card.active .card-title`);
            if(cardTitle) cardTitle.innerText = title || 'Sem Título';
        }
    },
    
    // --- Toolbar Logic ---
    setFocus(id) {
        this.focusId = id;
        document.querySelectorAll('.block').forEach(b => b.classList.remove('focused'));
        const el = document.getElementById('b-'+id);
        if(el) el.classList.add('focused');
    },

    setType(t) { this.modBlock(el => el.dataset.type = t); },
    setColor(c) { this.modBlock(el => el.dataset.color = c); },
    toggleFormat(f) {
        this.modBlock(el => {
            const curr = el.dataset.format || '';
            el.dataset.format = curr.includes(f) ? curr.replace(f,'') : curr + ' ' + f;
        });
    },
    delBlock() {
        if(!this.focusId) return;
        const el = document.getElementById('b-'+this.focusId);
        if(el) el.remove();
        this.focusId = null;
        this.saveDOM();
    },
    move(dir) {
        const el = document.getElementById('b-'+this.focusId);
        if(!el) return;
        if(dir === 'up' && el.previousElementSibling) el.parentNode.insertBefore(el, el.previousElementSibling);
        if(dir === 'down' && el.nextElementSibling) el.parentNode.insertBefore(el.nextElementSibling, el);
        el.querySelector('textarea').focus();
        this.saveDOM();
    },

    modBlock(fn) {
        if(!this.focusId) return;
        const el = document.getElementById('b-'+this.focusId);
        if(el) { fn(el); this.saveDOM(); }
    },

    resize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; },
    resizeAll() { document.querySelectorAll('textarea').forEach(t => this.resize(t)); },
    save: Utils.debounce(function() { App.saveDOM(); }, 500),

    // --- Modos ---
    modeRead() {
        this.saveDOM();
        const s = Store.data.find(x => x.id === this.curr);
        const box = document.getElementById('read-content');
        const root = document.documentElement; 
        
        // Pega cores computadas
        const getC = (k) => getComputedStyle(document.body).getPropertyValue(k).trim();

        let h = `<h1 style="font-size:48px; text-align:center">${s.title}</h1><p style="text-align:center; margin-bottom:50px; color:var(--txt-muted)">${s.ref}</p>`;
        
        s.blocks.forEach(b => {
            // Mapeia cor lógica para variável CSS
            const baseC = `--c-${b.color}`;
            const baseBg = `--bg-${b.color}`;
            
            let st = `margin-bottom:20px; color:var(${baseC});`;
            if(b.bold) st += 'font-weight:bold;';
            if(b.italic) st += 'font-style:italic;';
            
            if(b.type === 'topic') h += `<div style="${st} font-size:28px; font-weight:800">• ${b.content}</div>`;
            else if(b.type === 'highlight') h += `<div style="${st} background:var(${baseBg}); padding:30px; border-radius:8px; text-align:center; font-size:32px;">${b.content}</div>`;
            else if(b.type === 'scripture') h += `<div style="${st} border-left:4px solid var(${baseC}); padding:20px; font-family:'Lora',serif; font-size:22px;">${b.content}</div>`;
            else if(b.type === 'note') h += `<div style="${st} background:var(--bg-amber); color:var(--c-amber); padding:15px; border:1px solid var(--border); text-align:center; margin:20px 50px;">${b.content}</div>`;
            else h += `<div style="${st}">${b.content.replace(/\n/g,'<br>')}</div>`;
        });
        
        box.innerHTML = h;
        document.getElementById('reader').classList.add('active');
    },

    exportPDF() {
        const el = document.getElementById('read-content').cloneNode(true);
        el.style.color = 'black';
        el.style.background = 'white';
        // Força fundo branco para PDF
        Array.from(el.querySelectorAll('*')).forEach(n => {
            n.style.color = 'black'; // Simplifica para impressão
        });
        
        html2pdf().set({ margin:15, filename:'esboco.pdf', html2canvas:{scale:2} }).from(el).save();
    }
};

App.init();
</script>
</body>
</html>
