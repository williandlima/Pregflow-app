melhore esse programa e acrescente uma barra de rolagem na pagina de edição, use um design moderno e botões com estilo moderno:
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PregaFlow - Rolagem Corrigida</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        /* --- CONFIGURAÇÕES GERAIS --- */
        :root {
            --bg-app: #F3F4F6;       
            --bg-sidebar: #FFFFFF;   
            --bg-paper: #FFFFFF;     
            --bg-toolbar: #FFFFFF;   
            
            --txt-primary: #111827;
            --txt-secondary: #6B7280;
            
            --accent: #2563EB;
            --border: #E5E7EB;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; outline: none; }

        /* --- BARRA DE ROLAGEM (FORÇADA E VISÍVEL) --- */
        ::-webkit-scrollbar {
            width: 16px; /* Bem larga para o mouse */
            height: 16px;
        }
        ::-webkit-scrollbar-track {
            background: #E5E7EB; 
            border-left: 1px solid #D1D5DB;
        }
        ::-webkit-scrollbar-thumb {
            background: #9CA3AF; 
            border: 3px solid #E5E7EB; 
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280; /* Mais escuro ao passar o mouse */
        }

        body {
            margin: 0;
            height: 100vh; /* Altura total da tela */
            overflow: hidden; /* Impede scroll duplo na pagina inteira */
            background-color: var(--bg-app);
            font-family: 'Inter', sans-serif;
            color: var(--txt-primary);
        }

        /* --- LAYOUT PRINCIPAL --- */
        #app {
            display: grid;
            grid-template-columns: 300px 1fr; /* Esquerda fixa | Direita flexível */
            height: 100%;
            width: 100%;
        }

        /* --- COLUNA DA ESQUERDA (LISTA) --- */
        #view-list {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%; 
            overflow: hidden; /* Contém o scroll interno */
        }
        
        .brand { padding: 20px; font-weight: 700; border-bottom: 1px solid var(--border); }
        .btn-new { margin: 15px; padding: 12px; background: var(--txt-primary); color: white; border-radius: 6px; cursor: pointer; font-weight: 600; text-align: center; border: none; }
        
        #list-scroll {
            flex: 1; /* Ocupa o resto da altura */
            overflow-y: auto; /* SCROLL AQUI */
            padding: 10px;
        }

        .card { padding: 12px; border-radius: 6px; margin-bottom: 5px; cursor: pointer; border: 1px solid transparent; }
        .card:hover { background: #F3F4F6; border-color: #E5E7EB; }
        .card.active { background: #EFF6FF; border-color: #BFDBFE; color: var(--accent); }
        .card-title { font-weight: 600; margin-bottom: 4px; }
        .card-date { font-size: 12px; color: var(--txt-secondary); }

        /* --- COLUNA DA DIREITA (EDITOR) --- */
        #view-editor {
            display: flex;
            flex-direction: column;
            height: 100%; /* Garante altura total */
            position: relative;
            visibility: hidden; /* Escondido até selecionar um item */
        }

        /* Toolbar Fixa no Topo */
        .toolbar {
            height: 60px;
            flex-shrink: 0; /* Não encolhe */
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px; padding: 0 20px;
            z-index: 10;
        }

        /* ÁREA DE ROLAGEM DO EDITOR (AQUI ESTAVA O PROBLEMA) */
        .editor-scroll-container {
            flex-grow: 1; /* Cresce para preencher a tela */
            overflow-y: scroll; /* FORÇA A BARRA DE ROLAGEM */
            padding: 40px;
            display: block;
            background: var(--bg-app);
            scroll-behavior: smooth;
        }

        /* O "Papel" */
        .paper {
            background: white;
            max-width: 850px;
            min-height: 1000px; /* Altura mínima garantida */
            margin: 0 auto;
            padding: 60px;
            box-shadow: var(--shadow);
            border-radius: 2px;
            padding-bottom: 200px; /* Espaço extra no fim para digitar confortável */
        }

        /* Botões da Toolbar */
        .btn-tool { width: 32px; height: 32px; border: 1px solid transparent; background: transparent; cursor: pointer; border-radius: 4px; color: #555; }
        .btn-tool:hover { background: #eee; color: #000; }
        .btn-tool.active { background: #e0e7ff; color: var(--accent); border-color: #c7d2fe; }
        .sep { width: 1px; height: 20px; background: #ddd; margin: 0 5px; }
        .dot { width: 16px; height: 16px; border-radius: 4px; cursor: pointer; display: inline-block; border: 2px solid transparent; }
        .dot.active { border-color: #000; transform: scale(1.2); }

        /* Inputs do Editor */
        .inp-title { width: 100%; font-size: 32px; font-weight: 800; border: none; margin-bottom: 10px; resize: none; overflow: hidden; font-family: inherit; }
        .inp-ref { width: 100%; font-size: 18px; color: #666; border: none; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 30px; resize: none; font-family: inherit; }

        /* Blocos de Texto */
        .block-wrap { position: relative; display: flex; gap: 10px; padding: 4px 0; align-items: flex-start; }
        .drag { cursor: grab; color: #ccc; opacity: 0; margin-top: 5px; }
        .block-wrap:hover .drag { opacity: 1; }
        textarea { width: 100%; border: none; resize: none; font-family: inherit; font-size: 16px; line-height: 1.6; overflow: hidden; background: transparent; }
        
        /* Estilos */
        .block-wrap[data-fmt*="bold"] textarea { font-weight: 700; }
        .block-wrap[data-fmt*="italic"] textarea { font-style: italic; }
        .block-wrap[data-color="blue"] textarea { color: #1D4ED8; }
        .block-wrap[data-color="red"] textarea { color: #B91C1C; }
        .block-wrap[data-color="green"] textarea { color: #047857; }
        .block-wrap[data-color="amber"] textarea { color: #B45309; }

        .block-wrap[data-type="topic"] textarea { font-size: 20px; font-weight: 700; }
        .block-wrap[data-type="topic"] .drag { margin-top: 8px; }
        .block-wrap[data-type="scripture"] textarea { font-family: 'Lora', serif; font-style: italic; background: #f9fafb; padding: 10px 15px; border-left: 3px solid #ccc; }
        .block-wrap[data-type="highlight"] textarea { font-size: 24px; font-weight: 800; text-align: center; background: #f3f4f6; padding: 20px; border-radius: 8px; }
        .block-wrap[data-type="note"] textarea { background: #fffbeb; color: #92400e; padding: 10px; border: 1px solid #fcd34d; border-radius: 4px; font-size: 14px; }

        .btn-add { width: 100%; padding: 15px; margin-top: 20px; border: 2px dashed #e5e7eb; background: transparent; cursor: pointer; color: #6b7280; font-weight: 600; }
        .btn-add:hover { border-color: #9ca3af; color: #374151; }

        /* Modo Leitura */
        #reader { position: fixed; inset: 0; background: #111; z-index: 100; overflow-y: auto; display: none; }
        #reader.active { display: block; }
        .read-content { background: #fff; max-width: 900px; margin: 0 auto; padding: 80px; min-height: 100vh; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #000; color: #fff; padding: 8px 16px; border-radius: 4px; opacity: 0; transition: 0.3s; }

    </style>
</head>
<body>

<div id="app">
    <div id="view-list">
        <div class="brand">PregaFlow Studio</div>
        <button class="btn-new" onclick="App.create()">+ Novo Esboço</button>
        <div id="list-scroll">
            </div>
    </div>

    <div id="view-editor">
        <div class="toolbar">
            <button class="btn-tool" onclick="App.setType('text')">T</button>
            <button class="btn-tool" onclick="App.setType('topic')">H1</button>
            <button class="btn-tool" onclick="App.setType('scripture')">""</button>
            <button class="btn-tool" onclick="App.setType('highlight')">★</button>
            <button class="btn-tool" onclick="App.setType('note')">✎</button>
            <div class="sep"></div>
            <button class="btn-tool" onclick="App.setFmt('bold')"><b>B</b></button>
            <button class="btn-tool" onclick="App.setFmt('italic')"><i>I</i></button>
            <div class="sep"></div>
            <div class="dot" style="background:#333" onclick="App.setColor('gray')"></div>
            <div class="dot" style="background:#2563EB" onclick="App.setColor('blue')"></div>
            <div class="dot" style="background:#059669" onclick="App.setColor('green')"></div>
            <div class="dot" style="background:#DC2626" onclick="App.setColor('red')"></div>
            <div class="dot" style="background:#D97706" onclick="App.setColor('amber')"></div>
            <div style="flex:1"></div>
            <button class="btn-tool" onclick="Reader.open()" title="Leitura">👁</button>
            <button class="btn-tool" onclick="Exporter.pdf()" title="PDF">PDF</button>
            <button class="btn-tool" onclick="App.delBlock()" style="color:red">✕</button>
        </div>

        <div class="editor-scroll-container" id="main-scroll">
            <div class="paper">
                <textarea id="title" class="inp-title" placeholder="Título da Mensagem" rows="1" oninput="App.input(this)"></textarea>
                <textarea id="ref" class="inp-ref" placeholder="Referência / Texto Base" rows="1" oninput="App.input(this)"></textarea>
                
                <div id="blocks"></div>
                
                <button class="btn-add" onclick="App.add()">+ Adicionar Texto</button>
            </div>
        </div>
    </div>
</div>

<div id="reader"><button style="position:fixed;top:20px;right:20px;padding:10px;cursor:pointer" onclick="Reader.close()">Fechar</button><div id="read-box" class="read-content"></div></div>
<div id="toast" class="toast">Salvo</div>

<script>
/* SISTEMA SIMPLIFICADO E ROBUSTO */
const ID = () => Math.random().toString(36).substr(2, 9);
const DB = {
    get: () => JSON.parse(localStorage.getItem('pf_data') || '[]'),
    set: (d) => localStorage.setItem('pf_data', JSON.stringify(d))
};

const App = {
    curr: null, focus: null,

    init() {
        this.renderList();
        // Sortable (Arrastar)
        new Sortable(document.getElementById('blocks'), { 
            handle: '.drag', animation: 150, onEnd: () => this.save() 
        });
        const list = DB.get();
        if(list.length) this.open(list[0].id);
    },

    renderList() {
        const list = DB.get();
        document.getElementById('list-scroll').innerHTML = list.map(s => `
            <div class="card ${this.curr === s.id ? 'active' : ''}" onclick="App.open('${s.id}')">
                <div class="card-title">${s.title || 'Sem Título'}</div>
                <div class="card-date">${new Date(s.date).toLocaleDateString()}</div>
                <span style="font-size:12px;color:red;float:right" onclick="App.delSermon(event,'${s.id}')">Apagar</span>
            </div>
        `).join('');
    },

    create() {
        const s = { id: ID(), title: '', ref: '', date: Date.now(), blocks: [{id:ID(), type:'text', content:''}] };
        const l = DB.get(); l.unshift(s); DB.set(l);
        this.renderList(); this.open(s.id);
    },

    delSermon(e, id) {
        e.stopPropagation();
        if(!confirm('Apagar?')) return;
        const l = DB.get().filter(x => x.id !== id);
        DB.set(l);
        if(this.curr === id) document.getElementById('view-editor').style.visibility = 'hidden';
        this.renderList();
    },

    open(id) {
        if(this.curr) this.save();
        this.curr = id;
        const s = DB.get().find(x => x.id === id);
        if(!s) return;

        document.getElementById('view-editor').style.visibility = 'visible';
        document.getElementById('title').value = s.title;
        document.getElementById('ref').value = s.ref;
        this.resize(document.getElementById('title'));
        this.resize(document.getElementById('ref'));

        const box = document.getElementById('blocks'); box.innerHTML = '';
        s.blocks.forEach(b => box.appendChild(this.domBlock(b)));
        
        this.renderList(); // Atualiza active
    },

    domBlock(b) {
        const d = document.createElement('div'); d.className = 'block-wrap'; d.id = 'b-'+b.id;
        d.dataset.id = b.id; d.dataset.type = b.type || 'text'; d.dataset.color = b.color || 'gray';
        d.dataset.fmt = (b.bold?'bold ':'') + (b.italic?'italic':'');
        
        d.innerHTML = `
            <div class="drag">⠿</div>
            <textarea rows="1" onfocus="App.setFocus('${b.id}')" oninput="App.input(this)">${b.content || ''}</textarea>
        `;
        setTimeout(()=>this.resize(d.querySelector('textarea')),0);
        return d;
    },

    add() {
        const b = { id:ID(), type:'text', content:'' };
        const el = this.domBlock(b);
        document.getElementById('blocks').appendChild(el);
        const ta = el.querySelector('textarea');
        ta.focus();
        
        // ROLAGEM AUTOMÁTICA
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        this.save();
    },

    save() {
        if(!this.curr) return;
        const blocks = [];
        document.querySelectorAll('.block-wrap').forEach(el => {
            blocks.push({
                id: el.dataset.id,
                type: el.dataset.type,
                color: el.dataset.color,
                bold: el.dataset.fmt.includes('bold'),
                italic: el.dataset.fmt.includes('italic'),
                content: el.querySelector('textarea').value
            });
        });
        
        const title = document.getElementById('title').value;
        const list = DB.get();
        const idx = list.findIndex(x => x.id === this.curr);
        if(idx > -1) {
            list[idx] = { ...list[idx], title, ref: document.getElementById('ref').value, blocks };
            DB.set(list);
        }

        const t = document.getElementById('toast'); t.style.opacity=1; setTimeout(()=>t.style.opacity=0,1000);
    },

    // Ferramentas
    setFocus(id) { this.focus = id; },
    mod(fn) { if(!this.focus) return; const el = document.getElementById('b-'+this.focus); if(el){ fn(el); this.save(); } },
    
    setType(t) { this.mod(e => e.dataset.type = t); },
    setColor(c) { this.mod(e => e.dataset.color = c); },
    setFmt(f) { this.mod(e => { const c=e.dataset.fmt||''; e.dataset.fmt = c.includes(f)?c.replace(f,''):c+' '+f; }); },
    delBlock() { if(this.focus) { document.getElementById('b-'+this.focus).remove(); this.save(); } },

    input(el) {
        this.resize(el);
        // Debounce save
        clearTimeout(this.tm); this.tm = setTimeout(() => {
            this.save();
            if(el.id === 'title') this.renderList();
        }, 500);
    },
    resize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
};

const Reader = {
    open() {
        App.save(); const s = DB.get().find(x => x.id === App.curr);
        const box = document.getElementById('read-box');
        let h = `<h1>${s.title}</h1><p style="color:#666;margin-bottom:40px;border-bottom:1px solid #eee;padding-bottom:20px">${s.ref}</p>`;
        
        s.blocks.forEach(b => {
            let st = `margin-bottom:20px; color:${{gray:'#333',blue:'#1D4ED8',red:'#B91C1C',green:'#047857',amber:'#B45309'}[b.color||'gray']};`;
            if(b.bold) st += 'font-weight:bold;'; if(b.italic) st += 'font-style:italic;';
            const txt = (b.content||'').replace(/\n/g,'<br>');

            if(b.type === 'topic') h += `<h2 style="${st}">${txt}</h2>`;
            else if(b.type === 'highlight') h += `<div style="${st} background:#f3f4f6;padding:30px;text-align:center;font-size:24px;border-radius:8px;font-weight:800">${txt}</div>`;
            else if(b.type === 'scripture') h += `<blockquote style="${st} border-left:4px solid #ccc;margin:0;padding:10px 20px;font-family:serif;font-style:italic;background:#f9fafb">${txt}</blockquote>`;
            else if(b.type === 'note') h += `<div style="${st} background:#fffbeb;padding:15px;border:1px solid #fcd34d;color:#92400e;text-align:center;border-radius:4px">${txt}</div>`;
            else h += `<p style="${st} font-size:18px;line-height:1.6">${txt}</p>`;
        });
        box.innerHTML = h;
        document.getElementById('reader').classList.add('active');
    },
    close() { document.getElementById('reader').classList.remove('active'); }
};

const Exporter = {
    pdf() {
        Reader.open();
        const el = document.getElementById('read-box');
        html2pdf().set({margin:10, filename:'esboco.pdf', html2canvas:{scale:2}}).from(el).save();
        setTimeout(()=>Reader.close(), 1000);
    }
};

App.init();
</script>
</body>
</html>
