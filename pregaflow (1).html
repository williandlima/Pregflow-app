<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PregFlow Pro</title>

<!-- Manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- Estilos básicos -->
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f0f0f0;
        padding: 20px;
    }

    .app-container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    textarea {
        width: 100%;
        height: 300px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        resize: none;
    }

    button {
        margin-top: 10px;
        width: 100%;
        padding: 14px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #005fcc;
    }
</style>

</head>

<body>

<div class="app-container">
    <h2>PregFlow Pro</h2>

    <textarea id="editor" placeholder="Escreva aqui sua mensagem..."></textarea>

    <button onclick="saveText()">Salvar Mensagem</button>
    <button onclick="loadText()">Carregar Última</button>
    <button onclick="deleteText()">Apagar Mensagem</button>
</div>

<script>
    function saveText() {
        const content = document.getElementById("editor").value;
        localStorage.setItem("pregacao", content);
        alert("Mensagem salva!");
    }

    function loadText() {
        const content = localStorage.getItem("pregacao");
        document.getElementById("editor").value = content || "";
    }

    function deleteText() {
        localStorage.removeItem("pregacao");
        document.getElementById("editor").value = "";
        alert("Mensagem apagada.");
    }

    // Registrar Service Worker
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
    }
</script>

</body>
</html>
