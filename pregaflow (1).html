<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- VIEWPORT PARA DESKTOP -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PregFlow Pro — Desktop Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>

/* ========================================================================
   DESIGN SYSTEM (IGUAL O SEU) — APENAS AJUSTADO PARA DESKTOP
======================================================================== */

:root {
    --bg: #F5F6F7;
    --surface: #FFFFFF;
    
    --text: #111827;
    --text-secondary: #4B5563;
    --text-muted: #9CA3AF;
    
    --border: #E5E7EB;
    --border-hover: #D1D5DB;

    --primary: #7C3AED;
    --primary-hover: #6D28D9;
    --primary-soft: #F5F3FF;

    --danger: #EF4444;
    --danger-bg: #FEF2F2;

    --shadow-xs: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-sm: 0 4px 8px rgba(0,0,0,0.05);
    --shadow-lg: 0 16px 24px rgba(0,0,0,0.12);

    --radius: 12px;
    --radius-sm: 8px;

    --font-ui: 'Inter', sans-serif;
    --font-body: 'Merriweather', serif;

    --max-width-desktop: 1200px;
}

/* DARK MODE (igual ao original) */
body.dark {
    --bg: #18181B;
    --surface: #27272A;
    --text: #F4F4F5;
    --text-secondary: #A1A1AA;
    --text-muted: #71717A;
    --border: #3F3F46;
    --border-hover: #52525B;
    --primary: #A78BFA;
    --primary-hover: #C4B5FD;
    --primary-soft: #312E81;
}

/* ========================================================================
   BASE
======================================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;

    /* DESKTOP: fundo fluido, sem cortar */
    overflow-y: scroll;
}

.icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
}

/* ========================================================================
   LAYOUT PRINCIPAL — AGORA AJUSTADO PARA MONITOR
======================================================================== */

.screen {
    max-width: var(--max-width-desktop);
    margin: 0 auto;
    padding: 40px 40px;
    min-height: 100vh;
    display: none;
}
.screen.active {
    display: block;
    animation: fadeSlideUp 0.4s ease;
}

@keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
}

h1 {
    font-size: 32px;
    letter-spacing: -0.02em;
}

/* ========================================================================
   LISTA DE SERMÕES – AGORA EM MODO DE COLUNA LARGA
======================================================================== */

.sermon-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.sermon-card {
    background: var(--surface);
    padding: 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-xs);
    display: flex;
    justify-content: space-between;
    cursor: pointer;
    transition: 0.2s;
}
.sermon-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-sm);
    border-color: var(--primary);
}

.card-info h3 {
    font-size: 20px;
    margin: 0 0 6px;
}

/* ========================================================================
   FAB — DESKTOP (UPGRADE)
======================================================================== */

.fab-main {
    position: fixed;
    bottom: 40px;
    right: 40px;

    width: 64px;
    height: 64px;
    border-radius: 20px;

    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: var(--shadow-lg);
    cursor: pointer;
    transition: .25s;
}
.fab-main:hover {
    transform: scale(1.1) rotate(90deg);
}

/* ========================================================================
   EDITOR DESKTOP — CAMPOS MAIORES
======================================================================== */

.input-title {
    font-size: 34px;
}
.input-ref {
    font-size: 18px;
}

.toolbar-sticky {
    margin-bottom: 40px;
    padding: 8px 12px;
}

/* ========================================================================
   BLOCO DO EDITOR (TEXTO)
======================================================================== */

.block {
    font-size: 20px;
    line-height: 1.8;
}

/* ========================================================================
   PREACH MODE — MAIOR, ESTILO TELÃO
======================================================================== */

#preachScreen {
    font-size: 32px;
    padding: 100px 48px;
}

/* ========================================================================
   MODAIS — MAIORES PARA DESKTOP
======================================================================== */

.modal-sheet {
    max-width: 800px;
}
</style>
</head>
<body>
