<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PregFlow Pro – Desktop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #f5f5f7;
        --text: #222;
        --panel: #fff;
        --border: #ccc;
        --accent: #0057ff;
    }

    [data-theme="dark"] {
        --bg: #121212;
        --text: #eee;
        --panel: #1e1e1e;
        --border: #444;
        --accent: #4c8dff;
    }

    body {
        margin: 0;
        display: flex;
        height: 100vh;
        font-family: Inter, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    /* Sidebar */
    .sidebar {
        width: 280px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
    }

    .sidebar h2 {
        padding: 20px;
        margin: 0;
        font-size: 20px;
        border-bottom: 1px solid var(--border);
    }

    .notes-list {
        flex: 1;
        overflow-y: auto;
    }

    .note-item {
        padding: 15px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
    }
    .note-item:hover {
        background: var(--accent);
        color: white;
    }

    .new-btn {
        padding: 15px;
        text-align: center;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    /* Editor */
    .editor-area {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .toolbar {
        background: var(--panel);
        padding: 10px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 10px;
    }

    .toolbar button {
        padding: 8px 12px;
        border: 1px solid var(--border);
        background: var(--panel);
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
    }
    .toolbar button:hover {
        background: var(--accent);
        color: white;
    }

    #editor {
        flex: 1;
        width: 100%;
        padding: 25px;
        border: none;
        outline: none;
        resize: none;
        background: var(--bg);
        color: var(--text);
        font-size: 20px;
        font-family: Inter, sans-serif;
    }

    /* Scrollbars */
    *::-webkit-scrollbar {
        width: 8px;
    }
    *::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
    }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>PregFlow Pro</h2>
    <div class="notes-list" id="notesList"></div>
    <div class="new-btn" onclick="newNote()">+ Nova Mensagem</div>
</div>

<!-- EDITOR -->
<div class="editor-area">

    <!-- Toolbar -->
    <div class="toolbar">
        <button onclick="execCmd('bold')"><b>B</b></button>
        <button onclick="execCmd('italic')"><i>I</i></button>
        <button onclick="execCmd('underline')"><u>U</u></button>
        <button onclick="execCmd('insertUnorderedList')">• Lista</button>
        <button onclick="saveNote()">💾 Salvar</button>
        <button onclick="deleteNote()">🗑 Excluir</button>
        <button onclick="toggleTheme()">🌓 Tema</button>
    </div>

    <!-- Editor -->
    <div id="editor" contenteditable="true"></div>
</div>

<script>
/* ============================
   VARIÁVEIS GERAIS
============================ */
let notes = JSON.parse(localStorage.getItem("pregflow_notes") || "[]");
let currentNoteId = null;

/* ============================
   INICIALIZAÇÃO
============================ */
renderNotesList();

/* ============================
   FUNÇÕES DE NOTAS
============================ */
function renderNotesList() {
    const list = document.getElementById("notesList");
    list.innerHTML = "";

    notes.forEach(n => {
        const div = document.createElement("div");
        div.className = "note-item";
        div.innerText = n.title;
        div.onclick = () => openNote(n.id);
        list.appendChild(div);
    });
}

function newNote() {
    const id = Date.now();
    const newN = {
        id,
        title: "Nova Mensagem " + new Date().toLocaleString(),
        content: ""
    };
    notes.push(newN);
    saveToStorage();
    openNote(id);
}

function openNote(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;

    currentNoteId = id;
    document.getElementById("editor").innerHTML = note.content;
}

function saveNote() {
    if (currentNoteId === null) return;

    const note = notes.find(n => n.id === currentNoteId);
    note.content = document.getElementById("editor").innerHTML;

    // Primeiro título da mensagem como título da nota
    const firstLine = note.content.replace(/<[^>]+>/g, "").trim().split("\n")[0];
    if (firstLine.length > 0) note.title = firstLine;

    saveToStorage();
    renderNotesList();
}

function deleteNote() {
    if (!currentNoteId) return;

    notes = notes.filter(n => n.id !== currentNoteId);
    saveToStorage();

    document.getElementById("editor").innerHTML = "";
    currentNoteId = null;
    renderNotesList();
}

function saveToStorage() {
    localStorage.setItem("pregflow_notes", JSON.stringify(notes));
}

/* ============================
   EDITOR DE TEXTO
============================ */
function execCmd(cmd) {
    document.execCommand(cmd, false, null);
}

/* ============================
   TEMA
============================ */
function toggleTheme() {
    const current = document.body.getAttribute("data-theme");
    document.body.setAttribute("data-theme", current === "dark" ? "light" : "dark");
}
</script>

</body>
</html>
