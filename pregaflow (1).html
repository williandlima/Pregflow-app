<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PregaFlow — Apple Design (Melhorado)</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <!-- libs (kept small) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root{
      --bg-body:#F5F5F7; --glass: rgba(255,255,255,0.75); --panel:#FFFFFF; --muted:#86868B; --accent:#007AFF; --danger:#FF3B30; --sep:#D6D6DB; --shadow:0 12px 40px rgba(6,10,18,0.08);
      --radius-lg:18px; --radius-sm:10px; --sidebar-w:300px;
      --max-width:880px;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg-body);color:#111}
    button{font-family:inherit}

    /* APP LAYOUT */
    #app{display:flex;min-height:100vh;gap:20px;padding:20px}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);background:var(--panel);border-radius:16px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03);display:flex;flex-direction:column}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#66b0ff);display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    .brand h1{font-size:16px;margin:0}
    .brand p{margin:0;color:var(--muted);font-size:12px}

    .controls{margin-top:14px;display:flex;gap:10px}
    .btn{padding:10px 12px;border-radius:10px;border:none;background:#F2F2F7;color:#111;font-weight:600;cursor:pointer}
    .btn.primary{background:var(--accent);color:#fff}
    .search{margin-top:14px;width:100%;display:flex}
    .search input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--sep);background:transparent}

    .list{margin-top:14px;overflow:auto;padding-right:6px}
    .item{padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent}
    .item:hover{background:#FBFBFD;border-color:var(--sep)}
    .item.active{background:linear-gradient(180deg,#F0FBFF,#FFFFFF);border-color:rgba(0,122,255,0.12);box-shadow:0 6px 18px rgba(3,6,12,0.04)}
    .meta{display:flex;flex-direction:column}
    .meta .title{font-weight:700}
    .meta .date{font-size:12px;color:var(--muted)}

    .item-actions{display:flex;gap:6px}
    .icon-btn{background:transparent;border:1px solid transparent;padding:8px;border-radius:8px;cursor:pointer}

    /* MAIN */
    .main{flex:1;display:flex;flex-direction:column;gap:16px}
    .toolbar{height:64px;background:var(--glass);backdrop-filter:blur(8px);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03)}

    .toolset{display:flex;gap:8px;align-items:center}
    .tool-btn{height:40px;padding:8px 10px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-weight:600}
    .tool-btn.active{background:linear-gradient(180deg,#E8F5FF,#FFFFFF);color:var(--accent)}

    .paper-wrap{flex:1;overflow:auto}
    .paper{background:var(--panel);max-width:var(--max-width);margin:18px auto;padding:56px;border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03)}
    #title{font-size:36px;font-weight:800;border:none;outline:none;width:100%;display:block;margin-bottom:8px}
    #ref{font-size:16px;color:var(--muted);border:none;outline:none;width:100%;display:block;margin-bottom:30px}

    .blocks{display:flex;flex-direction:column;gap:12px}
    .block{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid transparent;align-items:flex-start}
    .block.focus{border-color:rgba(0,122,255,0.12);background:linear-gradient(180deg,#FBFEFF,#FFFFFF)}
    .drag{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#AAB;cursor:grab}
    .block textarea{flex:1;border:none;resize:none;font-size:17px;line-height:1.6;background:transparent}

    .block-type{display:flex;flex-direction:column;gap:6px}
    .small{font-size:12px;color:var(--muted)}

    .add-block{margin-top:18px;padding:16px;border-radius:12px;border:2px dashed #E8E8ED;background:transparent;color:var(--muted);cursor:pointer}

    /* READER overlay */
    #reader{position:fixed;inset:0;background:#fff;display:none;z-index:2000;overflow:auto}
    #reader.open{display:block}
    .reader-inner{max-width:900px;margin:0 auto;padding:80px}
    .reader-close{position:fixed;right:28px;top:20px;padding:10px 14px;border-radius:20px;border:none;background:#fff;box-shadow:var(--shadow);cursor:pointer}

    /* small responsive */
    @media (max-width:900px){
      .sidebar{display:none}
      #app{padding:12px}
      .paper{margin:12px;padding:28px}
    }

    /* toast */
    .toast{position:fixed;right:28px;bottom:28px;background:#111;color:#fff;padding:10px 14px;border-radius:12px;opacity:0;transform:translateY(8px);transition:all .32s}
    .toast.show{opacity:1;transform:translateY(0)}

  </style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">PF</div>
      <div>
        <h1>PregaFlow</h1>
        <p>Studio • Esboços</p>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="btnNew">+ Novo</button>
      <button class="btn" id="btnDup" title="Duplicar esboço">Dup</button>
    </div>

    <div class="search">
      <input id="q" placeholder="Pesquisar esboços" />
    </div>

    <div class="list" id="list"></div>

    <div style="margin-top:auto;font-size:12px;color:var(--muted);text-align:center;padding-top:14px">Auto-save • Drag & drop • Export PDF / JSON</div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="toolset">
        <button class="tool-btn" data-act="text">Aa</button>
        <button class="tool-btn" data-act="topic">H1</button>
        <button class="tool-btn" data-act="scripture">“</button>
        <button class="tool-btn" data-act="highlight">★</button>
        <button class="tool-btn" data-act="note">✎</button>
      </div>

      <div style="width:1px;height:36px;background:var(--sep);margin-left:8px;margin-right:8px"></div>

      <div class="toolset" id="fmt">
        <button class="tool-btn" data-fmt="b"><b>B</b></button>
        <button class="tool-btn" data-fmt="i"><i>I</i></button>
      </div>

      <div style="flex:1"></div>

      <div style="display:flex;gap:8px">
        <button class="btn" id="btnPreview">Exibir</button>
        <button class="btn" id="btnPdf">PDF</button>
        <button class="btn" id="btnExport">Exportar</button>
        <button class="btn" id="btnImport">Importar</button>
      </div>
    </div>

    <div class="paper-wrap">
      <article class="paper" id="paper" aria-live="polite">
        <input id="title" placeholder="Título da Mensagem" />
        <input id="ref" placeholder="Referência / Data" />

        <div class="blocks" id="blocks"></div>

        <button class="add-block" id="add">+ Adicionar Bloco</button>
      </article>

      <div style="text-align:center;color:var(--muted);margin-top:36px;" id="empty">Selecione ou crie um esboço para começar.</div>
    </div>
  </main>
</div>

<!-- READER -->
<div id="reader" aria-hidden="true">
  <button class="reader-close" id="closeReader">✕ Sair</button>
  <div class="reader-inner" id="readerContent"></div>
</div>

<div class="toast" id="toast">Salvo</div>

<script>
// --- Simple DB wrapper ---
const KEY = 'pf_improved_v1';
const DB = {
  all(){return JSON.parse(localStorage.getItem(KEY)||'[]')},
  set(list){localStorage.setItem(KEY, JSON.stringify(list))}
}

// utils
const ID = ()=>Math.random().toString(36).slice(2,9);
const fmtDate = ts => new Date(ts).toLocaleString('pt-BR');

// app state
const App = {
  curr:null, focus:null, tm:null,
  init(){
    this.bind();
    this.renderList();
    if(DB.all().length) this.open(DB.all()[0].id);
  },
  bind(){
    document.getElementById('btnNew').onclick = ()=>this.create();
    document.getElementById('btnDup').onclick = ()=>this.duplicate();
    document.getElementById('q').oninput = ()=>this.renderList();
    document.getElementById('add').onclick = ()=>this.add();
    document.getElementById('btnPdf').onclick = ()=>Exporter.pdf();
    document.getElementById('btnPreview').onclick = ()=>Reader.open();
    document.getElementById('btnExport').onclick = ()=>this.exportJSON();
    document.getElementById('btnImport').onclick = ()=>this.importJSON();
    document.getElementById('title').oninput = e=>this.onInput(e);
    document.getElementById('ref').oninput = e=>this.onInput(e);

    // toolbar short actions
    document.querySelectorAll('.tool-btn').forEach(b=>b.onclick = (ev)=>{
      const act = b.dataset.act; if(act) return App.setType(act);
      const f = b.dataset.fmt; if(f) return App.setFmt(f);
    });

    // global keyboard shortcuts: Ctrl+N new, Ctrl+S save, Ctrl+D duplicate
    window.addEventListener('keydown', e=>{
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='n'){ e.preventDefault(); this.create(); }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); this.save(); toast('Salvo'); }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d'){ e.preventDefault(); this.duplicate(); }
    });
  },
  renderList(){
    const q = document.getElementById('q').value.toLowerCase();
    const list = DB.all().filter(s=>!q|| (s.title||'').toLowerCase().includes(q) || (s.ref||'').toLowerCase().includes(q));
    const el = document.getElementById('list'); el.innerHTML = '';
    list.forEach(s=>{
      const div = document.createElement('div'); div.className='item'+(this.curr===s.id?' active':'');
      div.onclick = ()=>this.open(s.id);
      div.innerHTML = `<div class='meta'><div class='title'>${escapeHtml(s.title || 'Sem Título')}</div><div class='date'>${fmtDate(s.date)}</div></div>`;
      const actions = document.createElement('div'); actions.className='item-actions';
      const btnDel = document.createElement('button'); btnDel.className='icon-btn'; btnDel.textContent='Apagar'; btnDel.onclick = (e)=>{ e.stopPropagation(); this.del(s.id); };
      const btnEdit = document.createElement('button'); btnEdit.className='icon-btn'; btnEdit.textContent='Abrir'; btnEdit.onclick = (e)=>{ e.stopPropagation(); this.open(s.id); };
      actions.appendChild(btnEdit); actions.appendChild(btnDel);
      div.appendChild(actions);
      el.appendChild(div);
    });
  },
  create(){
    const s = { id:ID(), title:'', ref:'', date:Date.now(), blocks:[{id:ID(),type:'text',content:''}] };
    const all = DB.all(); all.unshift(s); DB.set(all); this.renderList(); this.open(s.id); toast('Novo esboço criado');
  },
  duplicate(){ if(!this.curr) return toast('Selecione um esboço'); const s = DB.all().find(x=>x.id===this.curr); if(!s) return; const copy = JSON.parse(JSON.stringify(s)); copy.id = ID(); copy.date = Date.now(); copy.title = (copy.title||'') + ' (cópia)'; DB.set([copy,...DB.all()]); this.renderList(); toast('Duplicado'); },
  del(id){ if(!confirm('Apagar este esboço?')) return; const keep = DB.all().filter(x=>x.id!==id); DB.set(keep); if(this.curr===id){ this.curr=null; document.getElementById('paper').style.display='none'; document.getElementById('empty').style.display='block'; } this.renderList(); toast('Removido'); },
  open(id){ if(this.curr) this.save(); this.curr = id; const s = DB.all().find(x=>x.id===id); if(!s) return; document.getElementById('paper').style.display='block'; document.getElementById('empty').style.display='none'; document.getElementById('title').value = s.title; document.getElementById('ref').value = s.ref; const box = document.getElementById('blocks'); box.innerHTML=''; s.blocks.forEach(b=> box.appendChild(this.renderBlock(b))); new Sortable(box,{handle:'.drag',animation:150,onEnd:()=>this.save()}); this.renderList(); },
  renderBlock(b){ const wrap = document.createElement('div'); wrap.className='block'; wrap.id='b-'+b.id; wrap.dataset.id=b.id; wrap.dataset.type=b.type||'text'; wrap.innerHTML = `<div class='drag' title='arrastar'>⠿</div><div style='flex:1'><textarea rows=1 placeholder='Digite aqui...' spellcheck='true'>${escapeHtml(b.content||'')}</textarea></div>`; const ta = wrap.querySelector('textarea'); ta.onfocus = ()=>{ this.focus = b.id; document.querySelectorAll('.block').forEach(x=>x.classList.remove('focus')); wrap.classList.add('focus'); this.updateToolbar(wrap); }
    ta.oninput = (e)=>{ this.resize(ta); this.onInput(e); };
    setTimeout(()=>this.resize(ta),0);
    return wrap; },
  add(){ if(!this.curr) return toast('Crie ou abra um esboço'); const b = {id:ID(),type:'text',content:''}; const box = document.getElementById('blocks'); const el = this.renderBlock(b); box.appendChild(el); el.querySelector('textarea').focus(); this.save(); },
  save(){ if(!this.curr) return; const list = DB.all(); const idx = list.findIndex(x=>x.id===this.curr); if(idx===-1) return; const blocks = []; document.querySelectorAll('.block').forEach(el=>{ blocks.push({ id: el.dataset.id, type: el.dataset.type, content: el.querySelector('textarea').value }); }); list[idx].title = document.getElementById('title').value; list[idx].ref = document.getElementById('ref').value; list[idx].blocks = blocks; list[idx].date = list[idx].date || Date.now(); DB.set(list); },
  onInput(e){ this.resize(e.target||e); clearTimeout(this.tm); this.tm = setTimeout(()=>{ this.save(); toast('Salvo'); this.renderList(); },700); },
  resize(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; },
  setType(t){ if(!this.focus) return toast('Selecione um bloco'); const el = document.getElementById('b-'+this.focus); if(!el) return; el.dataset.type = t; this.save(); this.updateToolbar(el); },
  setFmt(f){ if(!this.focus) return toast('Selecione um bloco'); const el = document.getElementById('b-'+this.focus); if(!el) return; // simple toggle stored in dataset
    el.dataset[f] = el.dataset[f]==='true' ? 'false' : 'true'; this.save(); this.updateToolbar(el);
  },
  updateToolbar(el){ document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active')); const t = el.dataset.type; document.querySelectorAll(`.tool-btn[data-act='${t}']`).forEach(x=>x.classList.add('active'));
  },
  exportJSON(){ const s = DB.all().find(x=>x.id===this.curr); if(!s) return toast('Abra um esboço'); const data = JSON.stringify(s,null,2); const blob = new Blob([data],{type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download = (s.title||'esboco') + '.json'; a.click(); URL.revokeObjectURL(url); },
  importJSON(){ const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json'; inp.onchange = e=>{ const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev=>{ try{ const obj = JSON.parse(ev.target.result); obj.id = ID(); obj.date = Date.now(); DB.set([obj,...DB.all()]); this.renderList(); toast('Importado'); }catch(err){ toast('Arquivo inválido') } } ; r.readAsText(f); }; inp.click(); }
}

// Reader & Exporter
const Reader = {
  open(){ if(App.curr) App.save(); const s = DB.all().find(x=>x.id===App.curr); if(!s) return toast('Selecione um esboço'); let html = `<h1 style="font-size:56px;margin-bottom:10px;line-height:1.05;">${escapeHtml(s.title)}</h1><p style="color:#888;margin-bottom:40px;border-bottom:1px solid #eee;padding-bottom:18px">${escapeHtml(s.ref)}</p>`; s.blocks.forEach(b=>{ const txt = escapeHtml(b.content||'').replace(/\n/g,'<br>'); if(b.type==='topic') html += `<h2 style="font-size:32px;margin-top:30px">${txt}</h2>`; else if(b.type==='highlight') html += `<div style="background:#F2F2F7;padding:30px;border-radius:12px;font-weight:800;font-size:28px;text-align:center;margin:18px 0">${txt}</div>`; else if(b.type==='scripture') html += `<blockquote style="font-family: 'Lora', serif;color:#444;border-left:4px solid #DDD;padding-left:18px;margin:12px 0">${txt}</blockquote>`; else if(b.type==='note') html += `<div style="background:#FFF9E6;padding:14px;border-radius:10px;color:#8A6D3B;margin:12px 0">${txt}</div>`; else html += `<p style="font-size:20px;line-height:1.6;margin:12px 0">${txt}</p>`; }); document.getElementById('readerContent').innerHTML = html; document.getElementById('reader').classList.add('open'); document.getElementById('reader').setAttribute('aria-hidden','false'); },
  close(){ document.getElementById('reader').classList.remove('open'); document.getElementById('reader').setAttribute('aria-hidden','true'); }
};

const Exporter = { pdf(){ Reader.open(); const el = document.getElementById('readerContent'); html2pdf().set({margin:18,filename:'esboco.pdf',html2canvas:{scale:2}}).from(el).save(); } };

// helpers
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }
function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// wire reader close
document.getElementById('closeReader').onclick = ()=>Reader.close();

// autosave on load + init app
App.init();

// expose App for debugging in console (optional)
window.App = App; window.DB = DB;
</script>
</body>
</html>
