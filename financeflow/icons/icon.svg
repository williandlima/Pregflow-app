<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Background grid lines -->
  <line x1="70" y1="370" x2="442" y2="370" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <line x1="70" y1="300" x2="442" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="70" y1="230" x2="442" y2="230" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="70" y1="160" x2="442" y2="160" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Bars -->
  <rect x="90" y="280" width="90" height="90" rx="14" fill="url(#bar1)"/>
  <rect x="211" y="200" width="90" height="170" rx="14" fill="url(#bar2)"/>
  <rect x="332" y="120" width="90" height="250" rx="14" fill="url(#bar3)"/>
  <!-- Trend line -->
  <polyline points="135,280 256,200 377,120" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots -->
  <circle cx="135" cy="280" r="13" fill="white"/>
  <circle cx="256" cy="200" r="13" fill="white"/>
  <circle cx="377" cy="120" r="13" fill="white"/>
  <!-- R$ label -->
  <text x="256" y="460" font-family="Arial,sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.9)">R$</text>
</svg>
