<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpando cache...</title>
<style>
  body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; background: #0D1117; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
  .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #7C3AED; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 1.1rem; opacity: 0.8; }
</style>
</head>
<body>
<div class="spinner"></div>
<p id="msg">Limpando cache e service workers...</p>
<script>
(async function () {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch (e) {}
  document.getElementById('msg').textContent = 'Pronto! Redirecionando...';
  setTimeout(() => { window.location.replace('./'); }, 1000);
})();
</script>
</body>
</html>
